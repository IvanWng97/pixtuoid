# Every caller inherits the widened graph here: `just deny` (local + ci-lint) and
# audit.yml's action, which passes --all-features itself. Without it the graph is
# default-features-only, so a dep behind a non-default feature leaves the
# bans/licenses/sources gate while advisories still see it.
[graph]
all-features = true

[advisories]
# Otherwise a stale `ignore` entry only warns, so a shipped upstream fix would rot
# behind a green run. Needs cargo-deny 0.20.2 (what cargo-deny-action@v2.1.1 pins);
# an older cargo-deny rejects the whole file over this key.
unused-ignored-advisory = "deny"
# No advisory is ignored. The last one (RUSTSEC-2026-0192, ttf-parser
# unmaintained) was retired by removing the crate instead of the warning: both
# routes to it were cut in #440 — `aa_text` parses with skrifa now, and winit
# takes `wayland-csd-adwaita-notitle`.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
