# A PR enters by `@mergifyio queue` once docs/CONTRIBUTING.md#the-merge-gate
# holds: its local rows are a judgement no condition can make. Branch
# protection's required checks and conversation resolution are injected as
# conditions, so they are not repeated here
# (docs.mergify.com/merge-queue/github-rulesets#how-condition-injection-works).
merge_queue:
  # With one PR per batch this checks in place: CI and the review bots judge
  # the PR's own head, where a batch's draft PR would get no review.
  max_parallel_checks: 1
  # Its "ready to queue" box cannot see the local rows.
  queue_controls_comment: false

queue_rules:
  - name: default
    batch_size: 1
    merge_method: squash
    update_method: merge
    # `auto` sizes this from unloaded runs, so a backlog of runners alone times
    # a PR out and costs a full CI rerun; this covers the backlogged full tier.
    checks_timeout: 60 min
    queue_conditions:
      # A stacked PR waits until its base lands and GitHub retargets it.
      - base = main
      - -draft
      # The in-place update would merge main into it, which release-plz.yml's
      # release-merge refuses after the merge (docs/CONTRIBUTING.md#cutting-the-release).
      - -head ~= ^release-plz-

pull_request_rules:
  # media-regen.yml's bot PR queues itself: it renders main's merged code, which
  # each look PR's generated-art lens already read as evidence. Every file it
  # touches must sit under docs/images/ (the list operator matches any file).
  - name: queue the README media regen
    conditions:
      - head = bot/media-regen
      - head-repo-full-name = IvanWng97/pixtuoid
      - -files ~= ^(?!docs/images/)
    actions:
      queue:
