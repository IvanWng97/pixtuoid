# CI failures that stay silent in normal use, cost something when they land,
# and that neither actionlint nor zizmor can see. A failure that turns CI red,
# that only an advisory signal would show, or that a release exposes the moment
# it happens does not belong here: it gets noticed without a contract.
#
# check.sh parses each `file` with yq and evaluates `assert` over it with
# `jq -e`, binding `$expected` to the entry's `expected` when there is one.
# false, null and a jq error all count as red, so a renamed job or a deleted
# key fails its contract instead of slipping past it. Each `break` is a jq edit
# of the same document that must turn `assert` red, and every run applies them
# all; a clause is proven able to fire only while some break falsifies it alone.

# ── The Claude reviewers: untrusted PR text read with the base branch's credentials

- id: reviewer-analyze-is-read-only
  file: .github/workflows/claude-readonly-review.yml
  why: >-
    analyze hands untrusted PR text to a model, so every scope on this job
    is one a prompt injection could reach; id-token is the only write it holds,
    for the model's workload-identity login.
  assert: |
    .jobs.analyze.permissions == {"contents": "read", "id-token": "write", "pull-requests": "read"}
  break:
    - .jobs.analyze.permissions.contents = "write"
    - .jobs.analyze.permissions.actions = "write"

- id: reviewer-checks-out-the-base
  file: .github/workflows/claude-readonly-review.yml
  why: >-
    Checking out the PR head here runs untrusted files beside the base branch's
    credentials. (A persisted checkout token is zizmor's `artipacked`.)
  assert: |
    [.jobs.analyze.steps[] | select((.uses // "") | startswith("actions/checkout@"))]
    | length == 1
      and .[0].with.ref == "${{ github.event.repository.default_branch }}"
  break:
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("actions/checkout@")) | .with.ref)
      = "${{ github.event.pull_request.head.sha }}"
    - '.jobs.analyze.steps += [{"uses": "actions/checkout@v7"}]'

- id: reviewer-model-only-reads
  file: .github/workflows/claude-readonly-review.yml
  why: >-
    The model reads untrusted diff text and its answer is published, so any
    reach beyond reading the checkout lets an injection act or publish a runner
    secret. dontAsk denies what no allow rule approves, `--tools` leaves only
    read tools, and `blockReadsOutsideWorkingDirectories` refuses a read outside
    the checkout even when a rule allows it
    (code.claude.com/docs/en/settings-reference). `--setting-sources user`
    drops the checkout's `.claude/` settings, which can add a hook and which
    the action loads by default
    (github.com/anthropics/claude-code-action/blob/v1/base-action/src/parse-sdk-options.ts);
    the action parses only its space-separated form. Any other flag, action input
    or settings key can add a rule, a tool, a hook or a directory, so all three
    are allowlists; other values stay free. `allowed_bots` admits the merge
    queue's app alone, never `*`, which would let any App's push trigger it.
  assert: |
    [.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@"))]
    | length == 1
      and ((.[0].with.allowed_bots // "") == "mergify[bot]")
      and ((.[0].with | keys) - [
            "allowed_bots", "anthropic_federation_rule_id", "anthropic_organization_id",
            "anthropic_service_account_id", "classify_inline_comments", "claude_args",
            "claude_code_oauth_token", "display_report", "github_token",
            "include_fix_links", "prompt", "show_full_output", "track_progress"] == [])
      and (.[0].with.claude_args as $args
           | ([$args | scan("(?<![\\w-])-{1,2}[A-Za-z][\\w-]*")] - [
                "--max-turns", "--max-budget-usd", "--permission-mode",
                "--setting-sources", "--tools", "--settings", "--json-schema"] == [])
             and [$args | scan("--permission-mode[ =](\\S+)")] == [["dontAsk"]]
             and [$args | scan("--setting-sources (\\S+)")] == [["user"]]
             and ($args | test("--setting-sources=") | not)
             and ([$args | scan("--tools[ =](.*?)(?= --|$)")]
                  | length == 1 and ([.[0][0] | splits("[ ,]+")] - ["Read", "Glob", "Grep"] == []))
             and ([$args | scan("--settings")] | length == 1)
             and ([$args | scan("--settings[ =]'([^']*)'")][0][0]
                  | fromjson == {"permissions": {"blockReadsOutsideWorkingDirectories": true}}))
  break:
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.allowed_bots)
      = "*"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      += " --allowedTools Read"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      += " --add-dir /"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      += " --mcp-config x"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      += " \"--settings\" {\"permissions\":{\"allow\":[\"Read\"]}}"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub(" --permission-mode dontAsk"; "")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub(" --setting-sources user"; "")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub("--setting-sources user"; "--setting-sources user,project")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub("--setting-sources user"; "--setting-sources=user")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      += " --setting-sources=user,project"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub("\"permissions\":\\{"; "\"permissions\":{\"defaultMode\":\"acceptEdits\",")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub("\"permissions\":\\{"; "\"permissions\":{\"additionalDirectories\":[\"/\"],")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub("\\{\"permissions\""; "{\"hooks\":{},\"permissions\"")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub("--tools Read,Glob,Grep"; "--tools Read,Glob,Grep,Bash")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_args)
      |= sub(" --settings '[^']+'"; "")
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with)
      += {"additional_permissions": "actions: write"}
    - '.jobs.analyze.steps += [{"uses": "anthropics/claude-code-action@v1", "with": {"claude_args": "--tools Bash"}}]'

- id: reviewer-model-auth-is-scoped
  file: .github/workflows/claude-readonly-review.yml
  why: >-
    The model authenticates with short-lived workload-identity credentials and
    the job's own token; the long-lived OAuth secret may only be the fallback
    for a repository with neither WIF variable set, never a credential every
    run receives.
  expected: >-
    ${{ vars.ANTHROPIC_FEDERATION_RULE_ID == '' && vars.ANTHROPIC_ORGANIZATION_ID == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
  assert: |
    [.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@"))]
    | length == 1
      and .[0].with.github_token == "${{ github.token }}"
      and .[0].with.anthropic_federation_rule_id == "${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}"
      and .[0].with.anthropic_organization_id == "${{ vars.ANTHROPIC_ORGANIZATION_ID }}"
      and .[0].with.claude_code_oauth_token == $expected
  break:
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.claude_code_oauth_token)
      = "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.github_token)
      = "${{ secrets.REVIEW_PAT }}"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.anthropic_federation_rule_id)
      = "${{ secrets.FEDERATION_RULE_ID }}"
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.anthropic_organization_id)
      = "${{ secrets.ORGANIZATION_ID }}"
    - '.jobs.analyze.steps += [(.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")))]'

- id: reviewer-output-stays-private
  file: .github/workflows/claude-readonly-review.yml
  why: >-
    show_full_output prints every Claude message, tool results included, to an
    Actions log anyone can read, which the input's own description warns can
    expose secrets
    (github.com/anthropics/claude-code-action/blob/v1/action.yml), and this job
    runs on untrusted PR text with the base branch's credentials.
  assert: |
    [.jobs[].steps[]? | select((.uses // "") | startswith("anthropics/claude-code-action@"))]
    | length >= 1 and all(.[]; (.with.show_full_output // false | tostring) == "false")
  break:
    - |
      (.jobs.analyze.steps[] | select((.uses // "") | startswith("anthropics/claude-code-action@")) | .with.show_full_output)
      = true
    - '.jobs.analyze.steps += [{"uses": "anthropics/claude-code-action@v1", "with": {"show_full_output": true}}]'
    - .jobs.analyze.steps |= map(select((.uses // "") | startswith("anthropics/claude-code-action@") | not))

- id: reviewer-writers-only-comment-and-status
  file: .github/workflows/claude-readonly-review.yml
  why: >-
    publish comments and sets the lens's status, report_absence only sets it,
    and any action in either, a checkout included, runs with that scope: an
    action reads `github.token` without being passed it
    (docs.github.com/en/actions/tutorials/authenticate-with-github_token).
  assert: |
    .jobs.publish.permissions == {"issues": "write", "pull-requests": "write", "statuses": "write"}
      and .jobs.report_absence.permissions == {"statuses": "write"}
      and ([.jobs.publish.steps[], .jobs.report_absence.steps[] | select(has("uses"))] | length == 0)
  break:
    - '.jobs.publish.steps += [{"uses": "actions/checkout@v7"}]'
    - '.jobs.report_absence.steps += [{"uses": "actions/checkout@v7"}]'
    - .jobs.publish.permissions.contents = "write"
    - .jobs.report_absence.permissions["pull-requests"] = "write"

- id: reviewer-fork-head-needs-a-maintainer
  file: .github/workflows/claude-review.yml
  why: >-
    allow_fork hands a fork's diff to a billed model, and the only approval is
    the `if:` admitting an issue_comment from a maintainer alone; an `if:` has no
    shell for action_behavior_test.sh to run.
  assert: |
    [.jobs[] | select(.uses == "./.github/workflows/claude-readonly-review.yml")] as $jobs
    | ($jobs | length == 1)
      and $jobs[0].with.allow_fork == "${{ github.event_name == 'issue_comment' }}"
      and ([($jobs[0].if // "") | gsub("\r?\n[ \t]*"; " ") | split(" || ")[]
            | select(contains("github.event_name == 'issue_comment'"))] as $arms
           | ($arms | length > 0)
             and all($arms[]; contains("contains(fromJSON('[\"OWNER\",\"MEMBER\",\"COLLABORATOR\"]'), github.event.comment.author_association)")))
  break:
    - (.jobs[] | select(has("uses")) | .with.allow_fork) = true
    - (.jobs[] | select(has("uses")) | .if) |= sub("github.event.comment.author_association"; "github.event.comment.user.login")
    - (.jobs[] | select(has("uses")) | .if) += " || (github.event_name == 'issue_comment' && github.event.issue.pull_request)"
    - .jobs.second = (.jobs[] | select(has("uses")))

# ── claude.yml: the only Claude job with contents:write

- id: claude-review-events-need-a-same-repo-head
  file: .github/workflows/claude.yml
  why: >-
    The job checks out without a ref, and on these two events that ref is the
    PR's merge ref, so an arm without the same-repo check stages a fork's files —
    its AGENTS.md files among them — as the agent's own instructions.
  assert: |
    . as $workflow
    | [.jobs[] | select(any(.steps[]?; (.uses // "") | startswith("anthropics/claude-code-action@")))] as $jobs
    | (($jobs[0].if // "") | gsub("\r?\n[ \t]*"; " ") | split(" || ")) as $arms
    | ($jobs | length == 1)
      and (["pull_request_review", "pull_request_review_comment"]
           | map(select(. as $event | $workflow.on | has($event)))
           | all(. as $event
                 | [$arms[] | select(contains("github.event_name == '\($event)'"))]
                 | length > 0
                   and all(contains("github.event.pull_request.head.repo.full_name == github.repository"))))
  break:
    - |
      .jobs.claude.if |= sub(
        "github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name == github.repository";
        "github.event_name == 'pull_request_review'")
    - |
      .jobs.claude.if |= sub(
        "github.event_name == 'pull_request_review_comment' && github.event.pull_request.head.repo.full_name == github.repository";
        "github.event_name == 'pull_request_review_comment'")
    - |
      .jobs.claude.if += " || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))"
    - del(.jobs.claude.if)
    - .jobs.second = .jobs.claude

- id: claude-refuses-forks-before-the-action
  file: .github/workflows/claude.yml
  why: >-
    An issue_comment payload's `issue.pull_request` holds only URLs, no head, so
    no `if:` can tell a fork's PR from a same-repo one, and the action's tag
    mode checks the PR head out regardless; the refusal has to be a step that
    runs before the action stages that tree (#799).
  assert: |
    [.jobs[] | select(any(.steps[]?; (.uses // "") | startswith("anthropics/claude-code-action@")))] as $jobs
    | ($jobs | length == 1)
      and ((.on | has("issue_comment") | not)
           or (($jobs[0].steps | to_entries) as $steps
               | ([$steps[] | select((.value.if // "") | contains("issue_comment"))
                            | select((.value.run // "") | contains("head.repo.full_name"))
                            | .key] | min) as $refusal
               | ([$steps[] | select((.value.uses // "") | startswith("anthropics/claude-code-action@"))
                            | .key] | min) as $action
               | $refusal != null and $refusal < $action))
  break:
    - .jobs.claude.steps |= (.[1:] + .[:1])
    - del(.jobs.claude.steps[0])
    - .jobs.claude.steps[0].if = "${{ always() }}"
    - .jobs.second = .jobs.claude

# ── Scopes that only look narrow

- id: cache-cleanup-stays-inert
  file: .github/workflows/cache-cleanup.yml
  why: >-
    Its jobs hold actions:write and one runs on pull_request_target, which a
    fork PR author can trigger; that stays harmless only while no job gains a
    wider scope or runs an action (an action reads `github.token` unasked).
  assert: |
    .permissions == {}
      and all(.jobs[]; .permissions == {"actions": "write"}
                       and all(.steps[]; has("uses") | not))
  break:
    - '.permissions = {"actions": "write"}'
    - .jobs["closed-pr"].permissions.contents = "write"
    - .jobs["closed-pr"].steps[0].uses = "actions/checkout@v7"

- id: oidc-only-on-the-tests-call
  file: .github/workflows/ci.yml
  why: >-
    A called workflow's job that declares no `permissions:` runs with exactly
    what its caller passes down, since a called workflow can only downgrade it
    (docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#supported-keywords-for-jobs-that-call-a-reusable-workflow),
    so id-token on any other group call hands a repository-scoped OIDC token to
    every job in it; ci-tests.yml's are the jobs that declare their own scopes.
  assert: |
    .jobs.tests.permissions == {"contents": "read", "id-token": "write"}
      and ([.jobs | to_entries[]
            | select(.key != "tests" and (.value | has("uses")))
            | select(.value.permissions["id-token"] == "write")]
           | length == 0)
  break:
    - '.jobs.lint.permissions = {"contents": "read", "id-token": "write"}'
    - .jobs.tests.permissions.contents = "write"

- id: ci-tests-jobs-declare-their-scope
  file: .github/workflows/ci-tests.yml
  why: >-
    ci.yml grants this whole workflow id-token for the Codecov OIDC upload, and
    a job that omits `permissions:` inherits that grant; every job must declare
    its own scope, and only a job that uploads to Codecov may keep id-token.
  assert: |
    all(.jobs[]; (.permissions | type) == "object"
                 and (.permissions["id-token"] != "write"
                      or any(.steps[]?; .uses == "./.github/actions/upload-codecov")))
  break:
    - del(.jobs.snapshots.permissions)
    - .jobs.smoke.permissions["id-token"] = "write"
    - .jobs.test.steps |= map(select(.uses != "./.github/actions/upload-codecov"))

# ── The merge gate

- id: group-required-judges-every-job
  file:
    - .github/workflows/ci-lint.yml
    - .github/workflows/ci-builds.yml
    - .github/workflows/ci-tests.yml
    - .github/workflows/site.yml
  why: >-
    ci.yml's gate sees a group only through the call's result, and GitHub does
    not document how a called workflow's jobs roll up into it. The `required`
    job is what judges each one — through require-jobs, which counts skipped
    and cancelled as red — so it must need every other job, and must run even
    when one of them fails.
  assert: |
    .jobs.required as $required
    | (.jobs | keys - ["required"]) == ($required.needs | sort)
      and $required.if == "${{ always() }}"
      and ($required | has("continue-on-error") | not)
      and ([$required.steps[]
            | select(.uses == "./.github/actions/require-jobs")
            | select(.with.results == "${{ toJSON(needs) }}")
            | select((has("if") or has("continue-on-error")) | not)]
           | length == 1)
  break:
    - '.jobs.unlisted = {"runs-on": "ubuntu-latest", "steps": [{"run": "true"}]}'
    - del(.jobs.required.if)
    - |
      .jobs.required.steps |= map(
        if .uses == "./.github/actions/require-jobs" then .with.results = "{}" else . end)
    - .jobs.required["continue-on-error"] = true
    - |
      .jobs.required.steps |= map(
        if .uses == "./.github/actions/require-jobs" then .if = "${{ success() }}" else . end)
    - |
      .jobs.required.steps |= map(
        if .uses == "./.github/actions/require-jobs" then .["continue-on-error"] = true else . end)

- id: only-the-light-tier-passes-skipped-jobs
  file:
    - .github/workflows/ci-builds.yml
    - .github/workflows/ci-tests.yml
    - .github/workflows/site.yml
  why: >-
    A PR's light tier skips its full-only jobs by design and must still pass
    ci-gate to enter the queue; the full tier judges the same jobs on the
    queue's draft PR, so a skip counted green there would merge an untested
    tree.
  assert: |
    [.jobs.required.steps[] | select(.uses == "./.github/actions/require-jobs")]
    | all(.with["allow-skipped"] == "${{ !inputs.full }}")
  break:
    - |
      .jobs.required.steps |= map(
        if .uses == "./.github/actions/require-jobs" then .with["allow-skipped"] = "true" else . end)

- id: ci-gate-judges-every-group
  file: .github/workflows/ci.yml
  why: >-
    `gate` is the only CI check branch protection requires. A job skipped
    because a job it needs failed reports "Success" and does not block a merge
    (docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions),
    so `gate` must run on `always()`; it must also need every group call and
    judge them all through require-jobs, or a group left out is free to fail.
  assert: |
    .jobs.gate as $gate
    | ([.jobs | to_entries[] | select(.value | has("uses")) | .key] | sort) == ($gate.needs | sort)
      and $gate.if == "${{ always() }}"
      and ($gate | has("continue-on-error") | not)
      and ([$gate.steps[]
            | select(.uses == "./.github/actions/require-jobs")
            | select(.with.results == "${{ toJSON(needs) }}")
            | select((has("if") or has("continue-on-error")) | not)]
           | length == 1)
  break:
    - .jobs.gate.if = "${{ success() }}"
    - '.jobs.extra = {"uses": "./.github/workflows/ci-extra.yml"}'
    - .jobs.gate.needs |= map(select(. != "tests"))
    - |
      .jobs.gate.steps |= map(
        if .uses == "./.github/actions/require-jobs" then .with.results = "${{ toJSON(needs.lint) }}" else . end)
    - .jobs.gate["continue-on-error"] = true
    - |
      .jobs.gate.steps |= map(
        if .uses == "./.github/actions/require-jobs" then .if = "${{ success() }}" else . end)
    - |
      .jobs.gate.steps |= map(
        if .uses == "./.github/actions/require-jobs" then .["continue-on-error"] = true else . end)

- id: queue-updates-by-merge
  file: .mergify.yml
  why: >-
    The queue updates the PR's own branch, and a rebase update force-pushes it
    (docs.mergify.com/merge-queue/rules#configuration-options): a PR stacked on
    it loses the commits it was built on, and every local checkout of it
    diverges, with nothing to show it until the next push.
  assert: |
    (.queue_rules | length > 0) and all(.queue_rules[]; .update_method == "merge")
  break:
    - .queue_rules[0].update_method = "rebase"
    - '.queue_rules += [{"name": "second", "update_method": "rebase"}]'

# ── Publishing

- id: release-publishes-after-ci-gate
  file: .github/workflows/release-plz.yml
  why: >-
    The publish runs on the merge push, and the merge queue can land other PRs
    while a release PR is open, so only a wait on that commit's own ci-gate
    proves the published tree passed CI. A job whose need failed or timed out
    is skipped unless its `if:` calls a status function
    (docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds),
    so the publish must need the wait and call none.
  assert: |
    .jobs as $jobs
    | [$jobs[] | select(any(.steps[]?; ((.uses // "") | startswith("release-plz/action@"))
                                       and .with.command == "release"))] as $publishers
    | ($publishers | length == 1)
      and (($publishers[0].if // "") | test("always\\(|failure\\(|cancelled\\(") | not)
      and ([$publishers[0].needs] | flatten | any(.[]; . as $need | $jobs[$need]
            | (has("continue-on-error") | not)
              and any(.steps[]; .env.CHECK_NAME == "ci-gate" and .env.SHA == "${{ github.sha }}"
                                and ((has("if") or has("continue-on-error")) | not))))
  break:
    - del(.jobs.release.needs)
    - .jobs.release.if += " || always()"
    - .jobs["ci-passed"]["continue-on-error"] = true
    - .jobs["ci-passed"].steps[0].env.SHA = "${{ github.event.before }}"
    - .jobs["ci-passed"].steps[0].env.CHECK_NAME = "lint"
    - .jobs["ci-passed"].steps[0]["continue-on-error"] = true
    - .jobs["ci-passed"].steps[0].if = "${{ false }}"

- id: every-main-push-gets-its-ci-gate
  file: .github/workflows/ci.yml
  why: >-
    The release waits for ci-gate on its own merge commit, and a concurrency
    group's newer run replaces its pending one unless the group queues
    (docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency),
    so a release commit whose run was replaced never gets one and the publish
    times out. A main push therefore owns its group or queues in it, and a run
    already in progress is never cancelled.
  expected: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  assert: |
    .concurrency as $c
    | (($c.group == $expected)
        or ($c.queue == "max" and ($c["cancel-in-progress"] // false | tostring) == "false"))
      and (($c["cancel-in-progress"] // false | tostring) as $cancel
           | $cancel == "false" or $cancel == "${{ github.event_name == 'pull_request' }}")
  break:
    - .concurrency.group = "ci-${{ github.ref }}"
    - .concurrency.group = "ci-${{ github.event_name == 'push' && github.ref || github.sha }}"
    - .concurrency["cancel-in-progress"] = true
    - .concurrency["cancel-in-progress"] = "${{ github.event_name != 'workflow_dispatch' }}"

- id: release-wait-only-for-a-release-merge
  file: .github/workflows/release-plz.yml
  why: >-
    The wait holds a runner, from the concurrency CI itself uses, for as long
    as CI takes, and only a merged release PR has anything to publish
    (release-plz's `should_release`), so it runs only when the detection says
    so. The tag check is what turns a detection miss red, so it runs after
    every push, whatever the publish did.
  assert: |
    .jobs as $jobs
    | [$jobs | to_entries[] | select(any(.value.steps[]?; .env.PR_BRANCH_PREFIX != null
                                         and ((.run // "") | contains("/commits/$SHA/pulls"))))] as $detectors
    | [$jobs[] | select(any(.steps[]?; .env.CHECK_NAME == "ci-gate"))] as $waits
    | [$jobs[] | select(any(.steps[]?; (.run // "") | contains("just workspace-version")))] as $tagged
    | ($detectors | length == 1)
      and ($waits | length == 1)
      and $waits[0].if == "needs.\($detectors[0].key).outputs.release == 'true'"
      and ($tagged | length == 1)
      and (($tagged[0].if // "") | contains("!cancelled()"))
      and (($tagged[0].if // "") | contains("outputs.release") | not)
  break:
    - del(.jobs["ci-passed"].if)
    - .jobs["ci-passed"].if = "needs.release-merge.outputs.release != 'false'"
    - del(.jobs["release-merge"].steps[0].env.PR_BRANCH_PREFIX)
    - del(.jobs["version-tagged"].if)
    - .jobs["version-tagged"].if = "${{ !cancelled() && needs.release-merge.outputs.release == 'true' }}"

- id: release-plz-publishes-only-release-prs
  file: release-plz.toml
  why: >-
    release-plz's default releases every unpublished package on every run
    (release-plz.dev/docs/config#the-release_always-field), and the release
    job's own gate is a copy of release-plz's test, so without this key a gate
    that stopped testing would ship a version bump that lands outside a release
    PR to crates.io with no human decision.
  assert: .workspace.release_always == false
  break:
    - del(.workspace.release_always)
    - .workspace.release_always = true

- id: release-archives-stage-every-notice
  file: .github/workflows/release.yml
  why: >-
    The binary embeds OFL-1.1 fonts, whose license must travel with every copy
    (crates/*/fonts/), and the archives ship only what these steps stage; npm
    repackages them. A missing notice fails nothing, and `just stage-notices`
    globs every embedded font's, so each packaging step must call it.
  assert: |
    [.jobs.build.steps[] | select((.name // "") | startswith("Package"))]
    | length == 2 and all(.run | contains("just stage-notices \"$DIR\""))
  break:
    - |
      (.jobs.build.steps[] | select(.name == "Package (Windows)") | .run)
      |= sub("just stage-notices \"\\$DIR\""; "cp LICENSE \"$DIR/\"")
    - .jobs.build.steps |= map(select(.name != "Package (Unix)"))

- id: debs-ship-the-license
  file:
    - crates/pixtuoid/Cargo.toml
    - crates/pixtuoid-hook/Cargo.toml
  why: >-
    cargo-deb's generated copyright file names the license without its text,
    which MIT requires in every copy; without this row a .deb ships none.
  assert: |
    .package.name as $name
    | [.package.metadata.deb.assets[]
       | select(.[0] == "../../LICENSE" and .[1] == "usr/share/doc/\($name)/")]
    | length == 1
  break:
    - .package.metadata.deb.assets |= map(select(.[0] != "../../LICENSE"))
    - |
      (.package.metadata.deb.assets[] | select(.[0] == "../../LICENSE") | .[1])
      = "usr/share/doc/"

- id: deb-ships-every-font-notice
  file: crates/pixtuoid/Cargo.toml
  why: >-
    The .deb is another copy of the binary, so it carries the embedded fonts'
    notices by the same glob `just stage-notices` uses; a narrower one drops a
    font silently.
  assert: |
    [.package.metadata.deb.assets[]
     | select(.[0] == "../*/fonts/**/*.txt" and .[1] == "usr/share/doc/pixtuoid/licenses/")]
    | length == 1
  break:
    - .package.metadata.deb.assets |= map(select(.[0] | startswith("target/")))
    - |
      (.package.metadata.deb.assets[] | select(.[0] | contains("fonts")) | .[0])
      = "../pixtuoid/fonts/*.txt"

- id: queue-restates-branch-protection
  file: .mergify.yml
  why: >-
    Branch protection is not injected (the bots never review the queue's draft
    PR), so the queue admits a PR only on the checks restated here; one missing
    lets a PR queue without it, and the merge then stalls on GitHub's own rule.
    The draft PR is judged on the full tier's ci-gate alone.
  assert: |
    all(.queue_rules[];
      .branch_protection_injection_mode == "none"
      and ((["check-success = ci-gate", "check-success = GitGuardian Security Checks",
             "check-success = claude-review/correctness", "check-success = claude-review/design",
             "#review-threads-unresolved = 0"] - .queue_conditions) == [])
      and .merge_conditions == ["check-success = ci-gate"])
  break:
    - .queue_rules[0].queue_conditions |= map(select(. != "check-success = claude-review/design"))
    - .queue_rules[0].queue_conditions |= map(select(. != "#review-threads-unresolved = 0"))
    - .queue_rules[0].branch_protection_injection_mode = "queue"
    - .queue_rules[0].merge_conditions = []
