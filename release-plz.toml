# release-plz owns the version bump, the release PR and the tag; release.yml
# (on: push tags v*) keeps every irreversible publish. Each key names the
# authority it defers to; policy/ci-observability pins the ones whose drift
# would retire the tag silently.
[workspace]
# crates.io + npm + provenance are release.yml's OIDC jobs — no standing token.
publish = false
# No CHANGELOG.md in this repo; release.yml renders the GitHub release body with
# git-cliff (cliff.toml). Side effect: the release PR body carries no changelog.
changelog_update = false
# release.yml's release step owns the GitHub release (assets + body).
git_release_enable = false
# One tag per release, enabled on `pixtuoid` alone below.
git_tag_enable = false
# CONTRIBUTING.md#versioning: pre-1.0, a feature bumps the minor.
features_always_increment_minor = true
# The `tag` job runs on every push to main; only a merged PR whose head branch
# carries `pr_branch_prefix` (the release PR, or a hand-made branch for a
# bot-less release) may tag. A hand-made branch with ONE commit squashes to
# that commit's title, so title it like `pr_name` below or cliff.toml lists it.
release_always = false
# release-plz's own default, declared because three mechanisms key on it: the
# tag gate above, ci-builds.yml's `semver` guard, and the recovery path in
# CONTRIBUTING.md#releasing.
pr_branch_prefix = "release-plz-"
# The squash-merge title is the PR title, and cliff.toml skips
# `^chore\(release\)` from the release body. Never `{{ package }}`: unset when
# more than one package updates.
pr_name = "chore(release): v{{ version }}"
# The step holding the PAT must run no compiler: cargo-semver-checks would run
# every dependency's build script with the token in its environment.
# ci-builds.yml's `semver` job answers "is the bump enough?" on the release PR
# instead, without a write credential.
semver_check = false

[[package]]
name = "pixtuoid"
git_tag_enable = true
# release.yml triggers on `v*`; policy/ci-observability pins this to that glob.
git_tag_name = "v{{ version }}"
