# yaml-language-server: $schema=https://json.schemastore.org/zizmor.json

rules:
  # actionlint (pinned in ci-lint.yml) rejects the `$/` uses syntax this audit
  # nudges toward — rhysd/actionlint#711 tracks support; re-enable when the pin
  # understands it.
  self-repository:
    disable: true
  unpinned-uses:
    config:
      # Symbolic refs are accepted by repository policy; zizmor still rejects
      # missing refs and audits their freshness and version consistency.
      policies:
        "*": ref-pin
