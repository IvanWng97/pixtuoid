paths:
  .github/workflows/claude-readonly-review.yml:
    ignore:
      # anthropics/claude-code-action v1.0.182 exposes these WIF inputs, but
      # actionlint v1.7.12's bundled action metadata predates them. Rego pins
      # the exact supported names until actionlint refreshes its catalog.
      - 'input "anthropic_(federation_rule_id|organization_id|service_account_id)" is not defined in action "anthropics/claude-code-action@v1"'
  .github/workflows/release.yml:
    ignore:
      # GitHub supports concurrency.queue, but actionlint v1.7.12 does not yet
      # know the field. Keep this path- and diagnostic-specific until
      # https://github.com/rhysd/actionlint/pull/654 is released.
      - 'unexpected key "queue" for "concurrency" section'
