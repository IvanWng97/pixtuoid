name: release

on:
  push:
    tags: ["v*"]

# Lossless repo-wide release queue: different tags must not interleave irreversible
# crates.io/npm publication, and a publish must never be interrupted.
concurrency:
  group: pixtuoid-release
  queue: max
  cancel-in-progress: false

# Least-privilege (#215): jobs inherit read-only and widen scope per job, so a
# compromised action anywhere else gets no repo-write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for the tag-on-main ancestry check below.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning] PR caches are merge-ref scoped; stable tags are ancestry-gated to main
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@cargo-nextest
      - uses: ./.github/actions/setup-just
      - name: Validate tag commit is on main
        # A release tag pushed at an arbitrary (unreviewed) commit must not build +
        # publish (#215). Pre-release tester tags are exempt — they test pre-merge.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main — release tags must be cut from main"
            exit 1
          fi
      - name: Validate tag matches Cargo.toml version
        run: |
          # A pre-release suffix is release-channel metadata, not a Cargo version,
          # so it validates against the base version.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          CARGO_VERSION=$(just workspace-version)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
      # Intentionally lighter than `just preflight` (no lint + hack): the tag comes
      # from main, which already passed the full CI matrix — this re-verifies
      # fmt/clippy/tests against the exact tagged commit.
      - run: just fmt-check
      - run: just clippy
      - run: just test

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # aarch64 cross-links on the same x64 runner (VC ARM64 components preinstalled).
          # `windows-latest` is validated only at TAG time (release.yml doesn't run on
          # PRs) — re-pin to a dated label if a runner-image bump regresses it.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning] PR caches are merge-ref scoped; stable tags are ancestry-gated to main
        with:
          prefix-key: v1-rust
          key: ${{ matrix.target }}

      - uses: ./.github/actions/setup-just

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: just build-target ${{ matrix.target }} "${{ matrix.cross || 'false' }}"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIR="pixtuoid-${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/pixtuoid" "$DIR/"
          cp "target/${{ matrix.target }}/release/pixtuoid-hook" "$DIR/"
          cp LICENSE "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Flat zip — exes at zip root so Expand-Archive doesn't double-wrap.
          VERSION="${GITHUB_REF_NAME}"
          DIR="pixtuoid-${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/pixtuoid.exe" "$DIR/"
          cp "target/${{ matrix.target }}/release/pixtuoid-hook.exe" "$DIR/"
          cp LICENSE "$DIR/"
          ( cd "$DIR" && 7z a "../${DIR}.zip" . )

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  deb:
    name: deb (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning] PR caches are merge-ref scoped; stable tags are ancestry-gated to main
        with:
          prefix-key: v1-rust
          key: deb-${{ matrix.target }}

      - uses: ./.github/actions/setup-just

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Build
        run: just build-target ${{ matrix.target }} "${{ matrix.cross || 'false' }}"

      - name: Build .deb packages
        run: just deb ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb
          if-no-files-found: error

  release:
    name: release
    needs: [build, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # creates the GitHub release
      id-token: write # provenance attestation (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- *.tar.gz *.deb *.zip > sha256sums.txt

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3 # zizmor: ignore[superfluous-actions] mature release action avoids hand-rolled gh release behavior
        with:
          # Mark v*-rc/-beta/-alpha tags as pre-releases so they don't surface as "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.changelog.outputs.content }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.zip
            artifacts/sha256sums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.zip

  publish:
    name: publish to crates.io
    # Gate on the FULL build matrix, not just `check`: a crates.io publish is
    # irreversible, so it must not fire for a tag whose binaries/debs don't build.
    needs: [check, build, deb]
    # Never publish a pre-release to crates.io — tester tags build artifacts only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io Trusted Publishing (#216): the auth step below exchanges this
      # claim for a short-lived token — it is the only credential, no standing
      # CARGO_REGISTRY_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # `cargo publish` BUILDS each crate to verify it, and default features
      # pull rodio -> cpal -> the ALSA headers. Without them the loop
      # irreversibly publishes the earlier crates, then fails to compile
      # pixtuoid — stranding the release half-published at a version that can
      # never be reused.
      - uses: ./.github/actions/setup-alsa
      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning] PR caches are merge-ref scoped; stable tags are ancestry-gated to main
        with:
          prefix-key: v1-rust
      - name: Authenticate to crates.io (OIDC trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Idempotent: swallow "already on crates.io" so a partially-published tag
          # can be re-run. Retry ONLY the index-propagation race (#111) — every
          # other failure (auth, validation, network) fails the job, never hidden.
          publish_one() {
            local crate="$1" attempt out
            for attempt in 1 2 3; do
              if out=$(cargo publish -p "$crate" 2>&1); then
                printf '%s\n' "$out"; echo "::notice::$crate published"; return 0
              elif grep -qiE 'already (exists|uploaded)|crate version .* is already' <<<"$out"; then
                printf '%s\n' "$out"; echo "::warning::$crate already on crates.io, skipping"; return 0
              elif grep -qiE 'no matching package|not found in registry|failed to select a version' <<<"$out"; then
                printf '%s\n' "$out"; echo "::warning::$crate: dependency not yet on the index — retry $attempt/3 after 20s"; sleep 20
              else
                printf '%s\n' "$out"; echo "::error::$crate publish failed"; return 1
              fi
            done
            printf '%s\n' "$out"; echo "::error::$crate failed after 3 attempts — index-propagation race, or an unsatisfiable dependency requirement"; return 1
          }
          for crate in pixtuoid-core pixtuoid-scene pixtuoid-hook pixtuoid; do
            publish_one "$crate"
          done

  npm:
    name: publish to npm
    # Same full-matrix gate as the crates.io `publish` job — an npm publish is also
    # irreversible (no unpublish after 72h), so one gate for every such publisher.
    needs: [check, build, deb]
    # Never publish a pre-release to npm — tester tags build artifacts only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance (`npm publish --provenance`)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7 # zizmor: ignore[cache-poisoning] this publisher does not enable setup-node's package cache
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm Trusted Publishing (#216): node 22 bundles npm 10.x but OIDC needs
      # >= 11.5.1, and OIDC is the only auth path (no NODE_AUTH_TOKEN) — without
      # this upgrade the publish silently fails unauthenticated. `registry-url`
      # above STAYS: it is what triggers npm's OIDC detection. Pinned EXACTLY, not
      # @11 — an irreversible publish must not float with the registry.
      - run: npm install -g npm@11.5.1 # zizmor: ignore[adhoc-packages] exact OIDC-capable npm bootstrap for trusted publishing
      - uses: ./.github/actions/setup-just

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract binaries per target
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Mirrors the `build` matrix + npm/generate.mjs TARGETS; that equality is
          # pinned by npm/generate.test.mjs (`just npm-check`).
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-gnu \
                        x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            dest="npm/dist/${target}"
            mkdir -p "$dest"
            tgz="artifacts/pixtuoid-${TAG}-${target}.tar.gz"
            zip="artifacts/pixtuoid-${TAG}-${target}.zip"
            if [ -f "$tgz" ]; then
              tar xzf "$tgz" -C "$dest" --strip-components=1
            elif [ -f "$zip" ]; then
              unzip -o "$zip" -d "$dest"
            else
              echo "::error::missing artifact for ${target} (${tgz} / ${zip})"
              exit 1
            fi
          done

      - name: Test the package generator
        run: just npm-check

      - name: Generate npm packages
        run: node npm/generate.mjs --version "${GITHUB_REF_NAME#v}" --artifacts npm/dist

      - name: Publish (platform packages first, launcher last)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Idempotent: swallow "cannot publish over previously published" so a
          # re-run of a partially-published tag is safe.
          publish_one() {
            local dir="$1" name out
            name=$(node -p "require('./${dir}/package.json').name")
            if out=$(npm publish "$dir" --access public --provenance 2>&1); then
              printf '%s\n' "$out"; echo "::notice::${name} published"; return 0
            elif grep -qiE 'cannot publish over|previously published' <<<"$out"; then
              # Match ONLY the over-publish phrase — never a bare 403, which npm
              # also emits for auth/scope/2FA failures we must NOT swallow.
              printf '%s\n' "$out"; echo "::warning::${name}@${VERSION} already on npm, skipping"; return 0
            else
              printf '%s\n' "$out"; echo "::error::${name} publish failed"; return 1
            fi
          }
          # Platform packages first so the launcher's optionalDependencies always
          # resolve to already-live versions. The `./` prefix is load-bearing:
          # `npm publish npm/pixtuoid` parses the path as a GitHub `owner/repo`
          # shorthand and tries to `git ls-remote` it.
          for dir in ./npm/@pixtuoid/cli-*; do publish_one "$dir"; done
          publish_one ./npm/pixtuoid
