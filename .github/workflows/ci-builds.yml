name: ci-builds

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a PR outside the merge queue: only the jobs without `if: inputs.full` run'
        type: boolean
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # `just hack` checks the host graph only; this job catches target-gated deps
  # and native calls escaping the core `native` boundary, and caps the size of
  # the wasm the site ships.
  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          targets: wasm32-unknown-unknown
          shared-key: gen-wasm
      - uses: ./.github/actions/gen-wasm
      - run: just gen-wasm-check wasm-check-selftest

  hack:
    name: feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: clippy
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-hack
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - run: just hack

  windows-check:
    name: windows-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          targets: x86_64-pc-windows-msvc
      - run: just check-windows

  other-unix-check:
    name: other-unix-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          targets: x86_64-unknown-freebsd
      - run: just check-other-unix

  packaging-linux:
    name: packaging-build (ubuntu-latest)
    if: ${{ inputs.full }}
    # The only clean `cargo install --locked`, default-features build on both
    # Homebrew bottle platforms: it catches stale lockfiles and new system
    # dependencies before an external autobump does.
    runs-on: ubuntu-latest
    # Two cold release installs use cargo-install target dirs, which the shared
    # cache only partially covers.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Packaging does not invoke just, so its setup is narrower than the shared
      # Rust+just action while keeping the same cache namespace.
      - uses: ./.github/actions/packaging-build

  packaging-macos:
    name: packaging-build (macos-latest)
    if: ${{ inputs.full }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/packaging-build

  required:
    name: required-build-jobs
    # Keep the protected gate's membership explicit; GitHub otherwise reports
    # a reusable workflow successful even after an unreferenced job is removed.
    if: ${{ always() }}
    needs: [wasm-check, hack, windows-check, other-unix-check, packaging-linux, packaging-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "Required build job failed"
          allow-skipped: ${{ !inputs.full }}
