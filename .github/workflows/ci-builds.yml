name: ci-builds

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # `just hack` checks the host graph only; this job catches target-gated deps
  # and native calls escaping the core `native` boundary. It deliberately does
  # not byte-compare wasm output — latest-stable builds drift.
  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          targets: wasm32-unknown-unknown
      # gen-wasm uses this same build recipe, preventing local/CI command drift.
      - run: just wasm-build
      # The size cap IS deterministic even when the rebuilt bytes are not.
      - run: just gen-wasm-check

  hack:
    name: feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - uses: taiki-e/install-action@cargo-hack
      - run: just hack

  windows-check:
    name: windows-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          targets: x86_64-pc-windows-msvc
      - run: just check-windows

  packaging-linux:
    name: packaging-build (ubuntu-latest)
    # The only clean `cargo install --locked`, default-features build on both
    # Homebrew bottle platforms: it catches stale lockfiles and new system
    # dependencies before an external autobump does.
    runs-on: ubuntu-latest
    # Two cold release installs use cargo-install target dirs, which the shared
    # cache only partially covers.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Packaging does not invoke just, so its setup is narrower than the shared
      # Rust+just action while keeping the same cache namespace.
      - uses: ./.github/actions/packaging-build

  packaging-macos:
    name: packaging-build (macos-14)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/packaging-build

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
      - uses: taiki-e/install-action@cargo-semver-checks
      - run: just semver

  required:
    name: required-build-jobs
    # Keep the protected gate's membership explicit; GitHub otherwise reports
    # a reusable workflow successful even after an unreferenced job is removed.
    if: ${{ always() }}
    needs: [wasm-check, hack, windows-check, packaging-linux, packaging-macos, semver]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "Required build job failed"
