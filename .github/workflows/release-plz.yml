name: release-plz

# Two triggers. `release-pr` is dispatched BY HAND, never on push:
# release-plz refreshes an open release PR on every main push, and a PR that
# carries non-bot commits is closed and re-opened fresh, so a bump a human
# raised on it would be orphaned by the next dependabot merge, and every
# refresh re-runs the full CI matrix. `release` runs only on a push to main
# that merges a release PR, once that commit's ci-gate passes.
#
# RENAMING THIS FILE BREAKS PUBLISHING: each crate's crates.io Trusted Publisher
# record is keyed on the workflow filename, so the OIDC claim stops matching
# until every record is updated.
on:
  workflow_dispatch:
  push:
    branches: [main]

# `release-pr` and `release` write through the GitHub API with RELEASE_PLZ_TOKEN,
# a fine-grained PAT (this repository; Contents + Pull requests read/write):
# GitHub never starts a workflow off GITHUB_TOKEN, so a tag created with the
# workflow's own token would leave release.yml silent — the job token itself
# needs no write.
# The action's git-config step fails loudly on an empty token.
#
# ACCEPTED RISK, stated because the pin that used to state it is gone: both
# jobs now COMPILE inside the step that holds this token — `cargo-semver-checks`
# on the release PR, `cargo publish` on the tag — so every dependency build
# script runs with a repository-scoped write credential in its environment.
# `release-plz.toml` turned both on deliberately. The mechanism that bounds it
# is a GitHub App installation token (~1 h, `actions/create-github-app-token`),
# which release-plz documents and its own repository uses; switching is a
# step-level change here plus two secrets.
permissions: {}

# Push runs go one at a time, in order: a push merged while a release run waits
# for CI would otherwise check the tag before that release creates it.
concurrency:
  group: release-plz-${{ github.event_name }}
  queue: max
  cancel-in-progress: false

jobs:
  release-pr:
    name: release PR
    # A dispatch from any other ref would open a release PR computed from that
    # tree; a fork has no secret.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'IvanWng97/pixtuoid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # The bump is computed from every commit since the crates.io baseline.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      # cargo-semver-checks builds the baseline and the current tree, and the
      # default `audio` feature reaches alsa-sys — hence the ALSA step above.
      - uses: ./.github/actions/setup-cargo-just
      # SHA-pinned, unlike this repo's floating majors: the step sees the PAT
      # (release-plz's security.md), and the SHA also pins the release-plz
      # binary the action installs. Dependabot's minor/patch ignore never
      # surfaces a `v0.6`; move it by hand.
      - id: release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # A dispatch that opens nothing is a green no-op inside release-plz, and
      # the human who pressed the button is owed an answer either way.
      - name: A release PR must have been opened
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          PRS_CREATED: ${{ steps.release-plz.outputs.prs_created }}
        run: |
          set -euo pipefail
          if [ "$PRS_CREATED" != "true" ]; then
            echo "::error::release-plz opened no release PR — its log above says why"
            exit 1
          fi
          echo "::notice::release PR: $(jq -r .html_url <<<"$PR")"

  # release-plz's own test with `release_always = false`: the pushed commit's
  # associated PRs include one whose head branch carries `pr_branch_prefix`
  # (release_plz_core command/release.rs `should_release`). Every other push
  # is a no-op for `release`, so nothing after this holds a runner for it.
  release-merge:
    name: is this push a merged release PR
    if: github.event_name == 'push' && github.repository == 'IvanWng97/pixtuoid'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - name: Detect a merged release PR
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH_PREFIX: release-plz-
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" \
            --jq "[.[] | select(.head.ref | startswith(\"$PR_BRANCH_PREFIX\")) | .head.sha][0] // \"\"")"
          release=false
          if [[ -n "$head" ]]; then
            # Its CHANGELOG and semver verdict cover only the main it was cut
            # from: main moved after the dispatch, or was merged into it.
            parent="$(gh api "repos/$REPOSITORY/commits/$SHA" --jq '.parents[0].sha')"
            stale="$(gh api "repos/$REPOSITORY/compare/$parent...$head" \
              --jq '.behind_by > 0 or any(.commits[]; (.parents | length) > 1)')"
            if [[ "$stale" != false ]]; then
              echo "::error::the release PR merged at ${SHA::7} did not hold all of main@${parent::7}, so its changelog misses commits and nothing is published. Revert this commit, then re-dispatch release-plz.yml (docs/CONTRIBUTING.md#cutting-the-release)"
              exit 1
            fi
            release=true
          fi
          echo "release=$release" >>"$GITHUB_OUTPUT"
          echo "a merged release PR at ${SHA::7}: $release"

  # A push trigger, not workflow_run, so the OIDC claim and GITHUB_SHA stay the
  # merge push's own; release-plz's documented gate is a check before
  # `release` in the publishing workflow (release-plz.dev/docs/github/advanced).
  ci-passed:
    name: ci-gate passed at this commit
    needs: release-merge
    if: needs.release-merge.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Outlasts ci.yml's slowest job and its runner queue; a timeout skips the
    # publish like a failure does.
    timeout-minutes: 90
    permissions:
      checks: read
    steps:
      - name: Wait for ci-gate on this commit
        env:
          CHECK_NAME: ci-gate
          GH_TOKEN: ${{ github.token }}
          POLL_SECONDS: 30
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          while :; do
            # Actions' run alone, as branch protection requires: another app
            # can post a check by the same name.
            if ! verdict="$(gh api "repos/$REPOSITORY/commits/$SHA/check-runs?check_name=$CHECK_NAME&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.started_at)
                | if . == null then "absent" elif .status != "completed" then "pending" else .conclusion end')"; then
              echo "::warning::could not read $CHECK_NAME at ${SHA::7}; retrying"
              verdict=pending
            fi
            case "$verdict" in
            success)
              echo "$CHECK_NAME passed at ${SHA::7}"
              exit 0
              ;;
            absent | pending) sleep "$POLL_SECONDS" ;;
            *)
              echo "::error::$CHECK_NAME concluded $verdict at ${SHA::7}, so nothing is published. Re-run this workflow once a ci.yml re-run passes"
              exit 1
              ;;
            esac
          done

  release:
    name: publish and tag a merged release PR
    needs: [release-merge, ci-passed]
    if: needs.release-merge.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io trusted publishing: release-plz exchanges this claim for a
      # short-lived token, so no CARGO_REGISTRY_TOKEN exists to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # release-plz walks the merged PR's commits to pick the one to tag,
          # and decides "already released" from LOCAL tags — a shallow fetch
          # carries none, so every release would look unreleased.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      # `cargo publish` BUILDS each crate to verify it, and the default `audio`
      # feature reaches alsa-sys — hence the ALSA step above.
      - uses: ./.github/actions/setup-cargo-just
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # release-plz tags only a commit whose PR came from a `release-plz-*` branch,
  # and exits GREEN when it declines; a detection miss above skips it outright.
  # Either way main is left at a version release.yml never sees, so this runs
  # on every push, whatever `release` did, to turn that red.
  #
  # At rest main always sits at a released version, so "the workspace version
  # is tagged" holds on every push and needs no diff against the previous
  # commit (which a multi-commit push would get wrong anyway).
  version-tagged:
    name: the workspace version is tagged
    needs: [release-merge, release]
    if: ${{ !cancelled() && needs.release-merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      - name: The workspace version must be tagged
        run: |
          set -euo pipefail
          version="$(just workspace-version)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is tagged"
          else
            echo "::error::main@${GITHUB_SHA::7} is at v$version but no tag v$version exists, so release.yml has not run for it. release-plz tags only a merged release-plz-* branch (release-plz.toml release_always). Re-running this workflow is the fix that keeps the changelog: a hand-pushed tag (git tag v$version $GITHUB_SHA && git push origin v$version) still builds and publishes, but its GitHub release has no body, because the changelog lives in the draft release-plz would have created"
            exit 1
          fi
