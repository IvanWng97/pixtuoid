name: hawk

# `just hawk` on main: AGENTS.md's Visibility rule, reported. ADVISORY by
# construction: nothing `needs:` it, it is not a required check, and its
# findings are warnings, so a red run means hawk itself could not run. Not on a
# PR or the queue's draft, where it could gate nothing: the merge's own push
# reports the same tree. A branch gets a run by dispatch.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - ".github/workflows/hawk.yml"
  workflow_dispatch:

concurrency:
  group: hawk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hawk:
    name: hawk (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cold, with no rust-cache: like codspeed.yml's, an advisory job's cache
    # would evict the required jobs' from the 10 GB quota.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-just
      - name: hawk (findings are warnings)
        run: just hawk > hawk.txt
      - name: Findings to the run summary
        if: always()
        run: |
          cat hawk.txt
          { echo '```'; cat hawk.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
