name: hermetic-nightly

# The drift watch: each profiled CLI's latest release against the scripted
# model, where a CLI that renamed or reshaped what pixtuoid reads turns a
# verdict red before a user upgrades into it.

on:
  schedule:
    - cron: "23 7 * * *" # daily 07:23 UTC
  workflow_dispatch:
permissions: {}

jobs:
  drift:
    permissions:
      contents: read
    uses: ./.github/workflows/hermetic.yml
    with:
      full: true
      cli: latest

  file:
    name: file the hermetic report
    needs: drift
    if: ${{ always() && needs.drift.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Each failed leg's runs, in a directory named after its artifact.
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.drift.outputs.runs }}-*

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create hermetic --color FBCA04 \
            --description "A hermetic run's verdict on an agent CLI's latest release" 2>/dev/null || true
          # The orchestrator owns the title, as each failed leg's report H1
          # naming its OS, and they carry the disposition: retitle on the dedup
          # path too. A leg whose runs hold no report.md could not run: red,
          # once the others are filed.
          reports=(*/report.md)
          title=$(for r in "${reports[@]}"; do head -1 "$r" | sed 's/^# //'; done | awk 'NR > 1 { printf "; " } { printf "%s", $0 }')
          num=$(gh issue list --label hermetic --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title"
            filed=0
          else
            url=$(gh issue create --title "$title" --label hermetic --body-file "${reports[0]}")
            num=${url##*/}
            filed=1
          fi
          for r in "${reports[@]:filed}"; do
            gh issue comment "$num" --body-file "$r"
          done
          for d in */; do
            [ -f "${d}report.md" ] || { echo "::error::${d%/} holds no report.md"; exit 1; }
          done
