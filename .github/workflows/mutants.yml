name: mutants

# ON-DEMAND only, and its own workflow rather than a job in ci.yml so a dispatch
# runs ONLY this. ADVISORY by construction: nothing `needs:` it, so a red run
# gates nothing — and cargo-mutants exits non-zero EXACTLY to signal surviving
# mutants, so that is NOT swallowed with continue-on-error.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: mutation testing (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `--in-diff` needs the merge base in history
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # cargo-mutants' baseline build dies before testing a single mutant
      # without the ALSA headers.
      - uses: ./.github/actions/setup-alsa
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # match setup-cargo-just's default cache namespace
      - uses: taiki-e/install-action@cargo-mutants
      - uses: taiki-e/install-action@cargo-nextest
      - uses: ./.github/actions/setup-just
      # workflow_dispatch has no pull_request context, so MUTANTS_BASE is left
      # empty — `just mutants` falls back to its origin/main default.
      - name: Mutation-test the diff vs main (advisory, non-blocking)
        run: just mutants
      - name: Upload surviving-mutants report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 7
          if-no-files-found: ignore
