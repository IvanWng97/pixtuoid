# A throwaway probe: reverted before this PR merges.
name: reusable probe of job.workflow fields

on:
  workflow_call:

permissions: {}

jobs:
  print:
    name: Print job.workflow fields
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Print and fetch at the job's workflow commit
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s=%s\n' job.workflow_repository "$WORKFLOW_REPOSITORY" job.workflow_sha "$WORKFLOW_SHA" \
            github.workflow_sha "$CALLER_WORKFLOW_SHA" github.sha "$EVENT_SHA"
          # The review's own guard and fetch, verbatim.
          [[ "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${WORKFLOW_REPOSITORY}/contents/.github/prompts/review-protocol.md?ref=${WORKFLOW_SHA}" > "$RUNNER_TEMP/protocol.md"
          test -s "$RUNNER_TEMP/protocol.md"
          head -3 "$RUNNER_TEMP/protocol.md"
