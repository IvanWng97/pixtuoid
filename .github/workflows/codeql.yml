name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 11 * * 3'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Implicit detection can drop a language in a multi-language repo.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Rust has only the no-build extractor; the other three share the mode.
          build-mode: none
          # `rust/cleartext-logging` reads every `*_session_id` as a credential
          # (its `maybeAccountInfo` name heuristic); here it is an agent CLI's
          # local key, and every alert to date was a test's failure message
          # echoing one. `paths-ignore` cannot carve an inline `#[cfg(test)]`
          # module out of its file, so the exclusion is per-query.
          config: |
            query-filters:
              - exclude:
                  id: rust/cleartext-logging

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          # Rust uploads only after the health gate below: a degraded extraction
          # yields FEWER alerts, so an early upload looks cleaner than reality.
          upload: ${{ matrix.language == 'rust' && 'never' || 'always' }}

      # The action stays green under heavy extractor diagnostics; gate on the SARIF metrics.
      - name: Verify Rust extraction health
        if: ${{ matrix.language == 'rust' }}
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          read -r with_diagnostics without_diagnostics < <(
            jq --slurp --exit-status --raw-output '
              def metric($id):
                [
                  .[] | .runs[]? as $run
                  | $run.properties.metricResults[]? as $metric
                  | ($metric.rule.toolComponent.index // -1) as $component_index
                  | ($metric.rule.index // -1) as $rule_index
                  | select($component_index >= 0 and $rule_index >= 0)
                  | $run.tool.extensions[$component_index].rules[$rule_index]
                  | select(.id == $id)
                  | $metric.value
                ]
                | if length == 1 then .[0]
                  else error("expected exactly one CodeQL metric for \($id)")
                  end;
              [
                metric("rust/summary/number-of-files-extracted-with-errors"),
                metric("rust/summary/number-of-successfully-extracted-files")
              ]
              | @tsv
            ' "$SARIF_DIR"/*.sarif
          )
          echo "Rust extraction: $without_diagnostics clean files; $with_diagnostics files with diagnostics"
          {
            echo "### Rust CodeQL extraction health"
            echo
            echo "| Metric | Files |"
            echo "| --- | ---: |"
            echo "| Clean files | $without_diagnostics |"
            echo "| Files with diagnostics | $with_diagnostics |"
            echo
            echo "The job fails when no file extracts cleanly or diagnostics affect at least as many files as extract cleanly."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( without_diagnostics <= 0 || with_diagnostics >= without_diagnostics )); then
            echo "::error title=Unhealthy Rust CodeQL database::$with_diagnostics files have extraction diagnostics; only $without_diagnostics are clean."
            exit 1
          fi

      - name: Upload Rust analysis
        if: ${{ matrix.language == 'rust' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: /language:${{ matrix.language }}
