name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 11 * * 3'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Explicit: implicit detection can omit languages in a multi-language repo.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # CodeQL's Rust no-build extractor embeds rust-analyzer, which can lag the
      # runner's rolling stable toolchain — pin it to the workspace's declared MSRV.
      - name: Prepare Rust semantic analysis
        if: ${{ matrix.language == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          workspace_msrv="$(
            cargo metadata --no-deps --format-version 1 |
              jq -er '
                [.packages[].rust_version]
                | select(length > 0 and all(.[]; . != null))
                | unique
                | select(length == 1)
                | .[0]
              '
          )"
          rustup toolchain install "$workspace_msrv" \
            --profile minimal \
            --component rust-src,rust-analyzer
          rust_sysroot="$(rustup run "$workspace_msrv" rustc --print sysroot)"
          rust_source="$rust_sysroot/lib/rustlib/src/rust/library"
          proc_macro_server="$rust_sysroot/libexec/rust-analyzer-proc-macro-srv"
          test -s "$rust_source/std/src/lib.rs"
          test -x "$proc_macro_server"
          {
            echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT=$rust_sysroot"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT_SRC=$rust_source"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_PROC_MACRO_SERVER=$proc_macro_server"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_CARGO_ALL_TARGETS=true"
          } >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Rust supports only the no-build extractor; the interpreted languages
          # in this matrix use the same mode.
          build-mode: none
          # `rust/cleartext-logging` is a name heuristic (`maybeAccountInfo` in
          # github/codeql shared/concepts/codeql/concepts/internal/
          # SensitiveDataHeuristics.qll, fetched 2026-09-01) that reads every
          # `*_session_id` as a credential. Here a session id is an agent CLI's
          # local key, hashed into `AgentId` at the decode boundary, and every
          # alert to date is a test's failure message echoing one. The tests
          # cannot be carved out: extraction covers every Cargo target
          # (`CARGO_ALL_TARGETS`, policy-pinned) and `paths-ignore` cannot split
          # an inline `#[cfg(test)]` module from its file. What the filter
          # forgoes: the query's sinks are prints and panics, never `tracing`
          # (the `log-injection` rows in github/codeql
          # rust/ql/lib/codeql/rust/frameworks/log.model.yml, same fetch), so a
          # session id reaching CLI output would go unflagged — the same
          # misclassification, not a leak.
          config: |
            query-filters:
              - exclude:
                  id: rust/cleartext-logging

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          # Rust defers its upload until the extraction-health gate below passes: a
          # degraded extraction yields FEWER alerts, so uploading first publishes a
          # security tab that looks CLEANER than reality. Only Rust defers —
          # upstream notes `never` complicates debugging.
          upload: ${{ matrix.language == 'rust' && 'never' || 'always' }}

      # The action stays green even when extractor diagnostics affect most files,
      # so enforce a threshold off CodeQL's own SARIF metrics.
      - name: Verify Rust extraction health
        if: ${{ matrix.language == 'rust' }}
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          read -r with_diagnostics without_diagnostics < <(
            jq --slurp --exit-status --raw-output '
              def metric($id):
                [
                  .[] | .runs[]? as $run
                  | $run.properties.metricResults[]? as $metric
                  | ($metric.rule.toolComponent.index // -1) as $component_index
                  | ($metric.rule.index // -1) as $rule_index
                  | select($component_index >= 0 and $rule_index >= 0)
                  | $run.tool.extensions[$component_index].rules[$rule_index]
                  | select(.id == $id)
                  | $metric.value
                ]
                | if length == 1 then .[0]
                  else error("expected exactly one CodeQL metric for \($id)")
                  end;
              [
                metric("rust/summary/number-of-files-extracted-with-errors"),
                metric("rust/summary/number-of-successfully-extracted-files")
              ]
              | @tsv
            ' "$SARIF_DIR"/*.sarif
          )
          echo "Rust extraction: $without_diagnostics clean files; $with_diagnostics files with diagnostics"
          {
            echo "### Rust CodeQL extraction health"
            echo
            echo "| Metric | Files |"
            echo "| --- | ---: |"
            echo "| Clean files | $without_diagnostics |"
            echo "| Files with diagnostics | $with_diagnostics |"
            echo
            echo "The job fails when no file extracts cleanly or diagnostics affect at least as many files as extract cleanly."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( without_diagnostics <= 0 || with_diagnostics >= without_diagnostics )); then
            echo "::error title=Unhealthy Rust CodeQL database::$with_diagnostics files have extraction diagnostics; only $without_diagnostics are clean."
            exit 1
          fi

      # Only the SARIF the gate above vouched for: a failed gate skips this step, so
      # no analysis reaches the security tab unless it was healthy enough to trust.
      - name: Upload Rust analysis
        if: ${{ matrix.language == 'rust' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: /language:${{ matrix.language }}
