name: security audit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1 # explicit pin: the floating @v2 has shipped a broken release — bump deliberately, not via the tag
        with:
          # Stale-ignore detection is NOT a flag here: `[advisories]
          # unused-ignored-advisory = "deny"` in deny.toml owns it, so it holds
          # for any caller of `check advisories`, not just this cron.
          command: check advisories
