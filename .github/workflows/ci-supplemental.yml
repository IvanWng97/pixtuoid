name: ci-supplemental

on:
  workflow_call:

jobs:
  # Advisory by contract: findings are annotations and never enter ci-gate.
  # Keeping the whole job supplemental also prevents checkout/npm/network
  # failures from becoming a new protected requirement.
  comment-lint:
    name: comment-lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main is required to identify new PR lines
          persist-credentials: false
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.44.1 # zizmor: ignore[adhoc-packages] upstream's pinned CLI install; advisory job has no write token
      - uses: extractions/setup-just@v4
      - run: |
          git fetch --quiet origin main
          just comment-lint origin/main --github
