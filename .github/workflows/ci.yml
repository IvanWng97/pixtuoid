name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Not ready_for_review: a PR runs the light tier draft or not, so marking it
    # ready would re-judge an unchanged head at the same tier.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Every main push gets its own group: in a shared one a newer push replaces
  # the pending run, so that SHA never gets the ci-gate a release waits on.
  # `queue: max` cannot do it here: it rejects `cancel-in-progress: true`,
  # which PR runs need, and takes no expression.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  # NEVER cancel an in-flight main run — back-to-back merges would abort each
  # other's CI verdict + Codecov upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two-step CI (docs.mergify.com/merge-queue/two-step): a PR's pushes run the
  # light tier and pass ci-gate on it; the full tier runs on the merge queue's
  # draft PR, where .mergify.yml's merge_conditions read ci-gate, and on main.
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        env:
          FULL: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Hygiene
    uses: ./.github/workflows/ci-lint.yml

  builds:
    name: Builds & Packaging
    needs: tier
    uses: ./.github/workflows/ci-builds.yml
    with:
      full: ${{ needs.tier.outputs.full == 'true' }}

  tests:
    name: Test Suite & Coverage
    needs: tier
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-tests.yml
    with:
      full: ${{ needs.tier.outputs.full == 'true' }}

  site:
    name: Site
    needs: tier
    uses: ./.github/workflows/site.yml
    with:
      full: ${{ needs.tier.outputs.full == 'true' }}

  gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [lint, builds, tests, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # toJSON(needs) carries every group this job needs, so a group added to
      # `needs` is judged without also being named in a verdict script.
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "CI group failed"
