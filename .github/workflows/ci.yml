name: ci

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review re-runs a head that a draft judged only at the light
    # tier. converted_to_draft is left out: a draft cannot merge, so re-judging
    # an unchanged head at the light tier would buy nothing.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # NEVER cancel an in-flight main run — back-to-back merges would abort each
  # other's CI verdict + Codecov upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `full` is false only on a draft PR (off pull_request the flag dereferences to
# an empty string, which `!` makes true); a draft skips the `if: inputs.full`
# jobs and the site call to spare the runner queue, and require-jobs
# counts those skips red, so its ci-gate is red by construction.
jobs:
  lint:
    name: Lint & Hygiene
    uses: ./.github/workflows/ci-lint.yml

  builds:
    name: Builds & Packaging
    uses: ./.github/workflows/ci-builds.yml
    with:
      full: ${{ !github.event.pull_request.draft }}

  tests:
    name: Test Suite & Coverage
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-tests.yml
    with:
      full: ${{ !github.event.pull_request.draft }}

  site:
    name: Site
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/site.yml

  gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [lint, builds, tests, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # toJSON(needs) carries every group this job needs, so a group added to
      # `needs` is judged without also being named in a verdict script.
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "CI group failed"
