name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual re-run of the full matrix (mutants has its own workflow)

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs (push-over-push), but NEVER cancel an in-flight
  # main run — back-to-back merges would otherwise abort each other's CI
  # verdict + Codecov upload. Main runs are cheap and rare; let them finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: extractions/setup-just@v4
      - run: just fmt-check
      - run: just arch

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # rodio/cpal (the default-on `audio` feature) needs ALSA headers to
      # BUILD on Linux (#633) — the runner has no sound card; tests never
      # open a device (the AudioSink seam).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # prefix-key v1: the [profile.dev] change (line-tables-only / deps
      # debug=false) altered dep fingerprints, but rust-cache's key (lockfile
      # hash) still FULL-MATCHED the stale v0 caches — and a full-match restore
      # suppresses the post-job save, so every run recompiled deps and never
      # replaced the cache. Bumping the prefix forces fresh keys + saves.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: extractions/setup-just@v4
      - run: just clippy

  # The wasm office (pixtuoid-web) must keep COMPILING for wasm32 — `just hack`
  # checks the no-default-features graph on the HOST target only, so a core
  # change that breaks the wasm build (a target-gated dep, a syscall outside
  # the `native` gate) would otherwise surface only when someone next runs
  # `just gen-wasm` locally. Build-only on purpose: NO byte-compare against
  # the committed site/public/wasm/ artifact (wasm output drifts across rustc
  # versions and this job installs latest stable — freshness stays a local
  # `just gen-wasm` + review concern, like the committed demo media).
  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: extractions/setup-just@v4
      # gen-wasm compiles through this same shared recipe (wasm-build) — one build
      # line, so what CI checks can't drift from what gen-wasm ships.
      - run: just wasm-build
      # The committed artifact's size cap (deterministic — a stat on the
      # checked-in blob, no toolchain drift; the byte-exact rebuild compare
      # stays deliberately un-CI'd).
      - run: just gen-wasm-check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1 # explicit pin: the floating @v2 broke 2026-07-13 (v2.1.0 shift-5 ate the subcommand; v2.1.1 fixed same-day) — bump deliberately, not via the tag
        with:
          # Advisories run daily in audit.yml; this PR gate checks the rest.
          # Keep in sync with the justfile `deny` recipe.
          command: check bans licenses sources

  machete:
    name: unused deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No rust-toolchain: cargo-machete parses Cargo.toml, it never compiles.
      - uses: taiki-e/install-action@cargo-machete
      - uses: extractions/setup-just@v4
      - run: just machete

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The ONE lightweight home for the non-Rust hygiene linters — single Go/Rust
      # binaries that need no Rust toolchain, so they share a job instead of one
      # boilerplate job each. shfmt + actionlint via the runner's preinstalled Go
      # (pinned to `just setup-tools`); lychee via taiki-e/install-action (the
      # repo's prebuilt-tool installer). actionlint shells out to shellcheck
      # (preinstalled on the runner) for its `run:`-block checks; lychee runs
      # `--offline` so the link check needs no network.
      - name: Install shfmt + actionlint
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.24.2
      - uses: extractions/setup-just@v4
      - run: just shfmt-check
      - run: just actionlint
      - run: just links

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # rodio/cpal (the default-on `audio` feature) needs ALSA headers to
      # BUILD on Linux (#633) — the runner has no sound card; tests never
      # open a device (the AudioSink seam).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # `just msrv` reads rust-version from Cargo.toml and self-installs that
      # pinned toolchain via the runner's rustup, so the floor lives in one place.
      # No rust-cache: it keys on the runner's stable, but this job builds on the
      # MSRV toolchain (different rustc fingerprint), so the target cache can't be
      # reused — a clean cold `cargo check` is the honest gate.
      - uses: extractions/setup-just@v4
      - run: just msrv

  notes-curated:
    name: release notes curated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No rust-toolchain: a grep guard against shipping uncurated release notes.
      - uses: extractions/setup-just@v4
      - run: just notes-curated

  npm-gen:
    name: npm package generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No rust-toolchain: this only exercises the Node generator's unit test —
      # the same `just npm-check` release.yml gates `npm publish` on, run here at
      # PR time so a generate.mjs regression can't first surface at tag-push.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - run: just npm-check

  readme:
    name: readme drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No rust-toolchain, no npm ci: gen-readme.mjs is pure node:builtins. It
      # fails if the committed README drifted from site/src/*.json. Lives HERE
      # (not the path-filtered `site` workflow) because ci.yml runs on every PR —
      # so it's safe to mark required without deadlocking PRs that don't touch site/.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - run: just gen-readme-check

  hack:
    name: feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # rodio/cpal (the default-on `audio` feature) needs ALSA headers to
      # BUILD on Linux (#633) — the runner has no sound card; tests never
      # open a device (the AudioSink seam).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: taiki-e/install-action@cargo-hack
      - uses: extractions/setup-just@v4
      - run: just hack

  windows-check:
    name: windows-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: extractions/setup-just@v4
      - run: just check-windows

  windows-test:
    name: windows-test
    # Unpinned back to windows-latest now the June 2026 VS2026-image migration has
    # settled. This job's own run validates the image on every PR — if it regresses,
    # re-pin to a dated runner label here.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: extractions/setup-just@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - run: just test
        env:
          NEXTEST_PROFILE: ci
      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/junit.xml
          report-type: test_results
          flags: windows
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  macos-test:
    name: macos-test
    # macOS is the primary dev/user platform (BSD CLI / launchd / ~/.config /
    # ~/.claude path behavior diverges from Linux) yet was previously untested in
    # CI — the homebrew-core submission was the first macOS build. macos-14 = Apple
    # Silicon (the modern default); the winit/softbuffer `floating` deps build
    # against the bundled SDK.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: extractions/setup-just@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - run: just test
        env:
          NEXTEST_PROFILE: ci
      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/junit.xml
          report-type: test_results
          flags: macos
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  packaging-build:
    name: packaging-build (${{ matrix.os }})
    # Mirrors how homebrew-core actually builds us, which NO other job does:
    # `cargo install --locked` from a clean tree, DEFAULT features on, on both
    # bottled platforms. Two failure classes only this job can catch:
    #
    #   1. A stale Cargo.lock. Every other job runs plain cargo, which silently
    #      UPDATES the lock when it drifts from a Cargo.toml edit; `--locked`
    #      makes that same state a hard error — red in Homebrew's CI, on an
    #      autobump we don't control (see docs/CONTRIBUTING.md#releasing).
    #   2. A NEW system-library dependency. release.yml builds Linux artifacts
    #      `--no-default-features`, so the default-feature Linux build ships
    #      nowhere else — it is exactly what core compiles. When this job goes
    #      red for a missing system lib, the core FORMULA needs a matching
    #      `depends_on`, landed in the same PR as the version bump.
    #
    # The apt line below does NOT mirror the core formula, and that gap is the
    # point. As of homebrew-core 2026-07-21 the formula declares only
    # `depends_on "rust" => :build` — it builds 0.15.0, which predates the
    # default-on `audio` feature (#633). libasound2-dev is what the CURRENT
    # tree needs (rodio → cpal → alsa-sys, whose build script panics when
    # pkg-config can't find ALSA).
    #
    # So this job proves the CODE builds from source; it CANNOT red on the
    # formula-side dep, because it installs the header itself. Adding
    # `depends_on "alsa-lib"` under `on_linux` is a release checklist item for
    # whichever version first ships `audio` — tracked in #731. Class #2 above
    # therefore covers a genuinely NEW system lib, not this already-known one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    # Two release-mode `cargo install`s from a cold cache; `cargo install` uses
    # its own target dir, so rust-cache only partly covers it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - name: Install ALSA headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo install --locked (both binaries, default features)
        run: |
          cargo install --locked --path crates/pixtuoid --root "${RUNNER_TEMP}/pkg"
          cargo install --locked --path crates/pixtuoid-hook --root "${RUNNER_TEMP}/pkg"
      - name: Replay the formula's install + test assertions
        run: |
          # pipefail is NOT in the default `run:` shell (bash -e): without it a
          # pipeline reports the LAST command's status, so a crashing binary
          # reads as green. These assertions are the oracle — they have to be
          # capable of failing.
          #
          # With pipefail on, never pipe the binary straight into `grep -q`:
          # -q exits at the first match, and `pixtuoid man` matches on line 1
          # (`.TH`), so the still-writing producer takes EPIPE and the pipeline
          # fails. Linux's 64K pipe buffer absorbs the rest of the output and
          # hides it; macOS's does not. Capture to a file, then grep the file —
          # that also lets `set -e` check the binary's OWN exit status.
          set -euo pipefail
          # Resolve the binary BEFORE reassigning HOME, and export HOME here
          # rather than in `env:` (a step-level HOME override also reaches the
          # runner's own tooling). `connect` WRITES agent config — the formula
          # runs it in a sandboxed testpath, so this must never see a real HOME.
          BIN="${RUNNER_TEMP}/pkg/bin/pixtuoid"
          export HOME="${RUNNER_TEMP}/fakehome"
          mkdir -p "${HOME}"
          out="${RUNNER_TEMP}/formula-test"
          mkdir -p "$out"

          "$BIN" --version                      > "$out/version"
          "$BIN" man                            > "$out/man.roff"
          "$BIN" completions bash               > "$out/completions.bash"
          "$BIN" init-pack "${HOME}/pack"
          "$BIN" validate-pack "${HOME}/pack"   > "$out/validate"
          "$BIN" connect claude-code --json     > "$out/connect.json"

          # The formula's FIRST assertion is `assert_match version.to_s` — a
          # CONTENT check. `set -e` only proves --version exited 0, so without
          # this grep the capture above is a dead oracle.
          grep -qF "$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)" "$out/version"
          grep -q '^\.TH' "$out/man.roff"
          grep -q pixtuoid "$out/completions.bash"
          grep -q 'OK: pack "skeleton"' "$out/validate"
          grep -q pixtuoid-hook "${HOME}/.claude/settings.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == [{"id":"claude-code","outcome":"connected"}], "connect --json envelope drifted from the homebrew-core contract"' "$out/connect.json"

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: taiki-e/install-action@cargo-semver-checks
      - uses: extractions/setup-just@v4
      - run: just semver

  # Public-API surface golden (cargo-public-api) for the two published libs —
  # COMPLEMENTS semver: the gate above says "major/minor?", this shows WHAT
  # changed as a reviewable diff of api/<crate>.txt. rustdoc JSON is nightly-only,
  # so `just api-surface-check` self-installs the pinned nightly (justfile
  # API_NIGHTLY — kept there so the toolchain version lives in ONE place); this
  # job only pins cargo-public-api to match the committed goldens. CI-only, like
  # semver. cargo-public-api isn't in taiki-e/install-action, so binstall it.
  api-surface:
    name: api-surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install cargo-public-api (pinned to match the committed goldens)
        run: cargo binstall -y cargo-public-api@0.52.0
      - uses: extractions/setup-just@v4
      - run: just api-surface-check

  # Doc-rendering gate: `cargo doc` with every rustdoc warning as an error
  # (broken/private intra-doc links are denied in `[workspace.lints.rustdoc]`)
  # + run the doctests `cargo nextest` skips. Neither is visible to the build /
  # clippy / test jobs. Stable toolchain (these are not nightly lints).
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # rodio/cpal (the default-on `audio` feature) needs ALSA headers to BUILD
      # on Linux — `cargo doc` + the doctests compile the binary crate.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: extractions/setup-just@v4
      - run: just doc-check

  # ADVISORY (never blocks): flag NEW runs of 3+ consecutive `//` comments in a
  # fn body on a PR's changed lines (the ~5k pre-existing legitimate WHY
  # comments are grandfathered — see `just comment-lint`). Findings surface as
  # inline `::warning::` annotations on the diff; the script exits 0 so the job
  # is green regardless. Just ast-grep + python — no cargo build.
  comment-lint:
    name: comment-lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need origin/main to diff the PR range
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.44.1
      - uses: extractions/setup-just@v4
      - run: |
          git fetch --quiet origin main
          just comment-lint origin/main --github

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # rodio/cpal (the default-on `audio` feature) needs ALSA headers to
      # BUILD on Linux (#633) — the runner has no sound card; tests never
      # open a device (the AudioSink seam).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - uses: extractions/setup-just@v4
      - name: Generate coverage + JUnit XML (single test run)
        run: just coverage
      # Negative control: `fail_ci_if_error: false` (below) plus all-informational
      # Codecov statuses mean a BROKEN instrument that produces an empty/missing
      # lcov would upload nothing and CI would stay green — the exact false-green
      # class the oracle plan (#727) exists to kill. A broken GENERATION must red
      # the job here; only the transient UPLOAD stays non-blocking.
      - name: Assert coverage artifacts are non-empty (negative control)
        shell: bash
        run: |
          set -euo pipefail
          for f in lcov.info target/nextest/ci/junit.xml; do
            [ -s "$f" ] || { echo "::error::coverage produced no $f — a broken instrument must red the job, not silently upload nothing"; exit 1; }
          done
          echo "lcov.info=$(wc -c < lcov.info)B junit.xml=$(wc -c < target/nextest/ci/junit.xml)B"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: target/nextest/ci/junit.xml
          report-type: test_results
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Per-OS line coverage for the platform-gated surface the ubuntu `coverage` job
  # compiles OUT and therefore CANNOT measure: the `cfg(windows)` parity twins, the
  # named-pipe transport, `platform::home_first_dir`'s Windows arm,
  # `write_config_atomic`'s rename-retry, the macOS path/`launchd` arms. These run
  # the SAME `just coverage` recipe as ubuntu (one source of truth) and upload lcov
  # under the SAME per-OS flag the required *-test jobs already use for their JUnit
  # (Codecov keeps coverage and test_results separate per report-type, so the flag
  # now means "everything measured on this platform").
  #
  # Deliberately SEPARATE from the required windows-test / macos-test jobs, and NOT
  # required themselves: those stay fast, uninstrumented pass/fail gates, so the
  # ~2x coverage-instrumentation cost — and any first-run instrumentation surprise
  # on the never-before-instrumented platform-gated code — can never couple into a
  # REQUIRED merge gate. Safe to instrument now that #736/#756 sized the audio-synth
  # per-test caps for the coverage slowdown (measured on Apple Silicon: the belted
  # `generated_beds_` ran 52s instrumented vs its 300s cap; the shim latency twins
  # 0.13s vs their 200ms bound). Promote to required in a follow-up once real runs
  # confirm they stay green — especially the Windows shim/pipe latency twins, which
  # no instrumented run has ever exercised (they are compiled out on ubuntu).
  coverage-windows:
    name: coverage-windows
    runs-on: windows-latest
    # Instrumented full suite on the slowest runner. Per-test HANGS are already
    # caught by nextest's slow-timeout, so this bound only has to cover total
    # wall-clock + a cold instrumented compile (rust-cache keys the entry by
    # RUSTFLAGS, so a cache miss rebuilds `-C instrument-coverage` from scratch).
    # Retightened 60→20 after ~18 runs (incl. the first cold ones) measured a COLD
    # worst-case of 10.3m (warm p95 ~8.7m) — 20m is ~2× the observed cold max, so it
    # can't flake this now-required job while a 2×+ wall-clock regression trips (#757).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Shared v1-rust prefix like every other job: rust-cache already keys by job-id
      # AND RUSTFLAGS, so this instrumented job gets its own cache entry without
      # colliding with the uninstrumented windows-test (the sibling ubuntu `coverage`
      # job is likewise instrumented on v1-rust).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: extractions/setup-just@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage + JUnit XML (single instrumented test run)
        run: just coverage
      # Same false-green negative control as the ubuntu coverage job.
      - name: Assert coverage artifacts are non-empty (negative control)
        shell: bash
        run: |
          set -euo pipefail
          for f in lcov.info target/nextest/ci/junit.xml; do
            [ -s "$f" ] || { echo "::error::coverage produced no $f — a broken instrument must red the job, not silently upload nothing"; exit 1; }
          done
          echo "lcov.info=$(wc -c < lcov.info)B junit.xml=$(wc -c < target/nextest/ci/junit.xml)B"
      # lcov ONLY — the required windows-test job already uploads this platform's
      # JUnit under flag `windows`; re-uploading it here would double the test rows.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: windows
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage-macos:
    name: coverage-macos
    runs-on: macos-14
    # Apple Silicon is fast (the belted audio measured 52s instrumented), so a
    # tighter bound than windows suffices. Retightened 45→15 after ~18 runs measured
    # a COLD worst-case of 7.8m — ~2× headroom, same flake-safe sizing as windows (#757).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: extractions/setup-just@v4
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage + JUnit XML (single instrumented test run)
        run: just coverage
      - name: Assert coverage artifacts are non-empty (negative control)
        shell: bash
        run: |
          set -euo pipefail
          for f in lcov.info target/nextest/ci/junit.xml; do
            [ -s "$f" ] || { echo "::error::coverage produced no $f — a broken instrument must red the job, not silently upload nothing"; exit 1; }
          done
          echo "lcov.info=$(wc -c < lcov.info)B junit.xml=$(wc -c < target/nextest/ci/junit.xml)B"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: macos
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  snapshots:
    name: snapshot hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # rodio/cpal (the default-on `audio` feature) needs ALSA headers to
      # BUILD on Linux (#633) — the runner has no sound card; tests never
      # open a device (the AudioSink seam).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: taiki-e/install-action@cargo-nextest
      - uses: taiki-e/install-action@cargo-insta
      - uses: extractions/setup-just@v4
      # Runs the suite under nextest and fails on a pending OR unreferenced
      # (orphan) snapshot — the rot plain `cargo test` can't see. Separate from
      # the coverage job because cargo-insta needs an UNinstrumented run to track
      # which snapshots were referenced.
      - run: just snapshots

  # (mutation testing moved to its own on-demand workflow, mutants.yml — when it
  # lived here, dispatching it re-ran this entire matrix alongside it.)

  smoke:
    name: smoke
    # No `needs:` — smoke builds the release binary + renders + pixel-diffs; it
    # has no artifact/data dependency on fmt/clippy (they're independent gates).
    # Running it in parallel (vs gated behind lint) shaves latency on green PRs;
    # the only thing given up is fail-fast (a doomed PR still burns one smoke run).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # rodio/cpal (the default-on `audio` feature) needs ALSA headers to
      # BUILD on Linux (#633) — the runner has no sound card; tests never
      # open a device (the AudioSink seam).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust # see the clippy job's note
      - uses: extractions/setup-just@v4
      - name: Build release binaries + examples
        run: just build --release --bins --examples
      - name: pixtuoid --help exits 0
        run: ./target/release/pixtuoid --help
      - name: pixtuoid-hook exits 0 with no socket
        # Both halves of invariant #5's "always exit 0 SILENTLY", on the
        # RELEASE profile (the test suite covers the debug build): the
        # pipeline status is the shim's exit code (bash -e, no pipefail),
        # and any output at all fails the emptiness check.
        run: |
          out=$(echo '{}' | ./target/release/pixtuoid-hook 2>&1)
          test -z "$out"
          echo "hook shim exited 0 silently (expected no-op with no socket)"
      # (The install/uninstall round-trip is no longer a CLI command — binding a
      # source is the in-TUI Sources panel's job. The hook-write round-trip
      # against every target is unit-tested by
      # `install::tests::install_target_round_trips_every_registered_target`.)
      # gen-check renders the office (Pillow + ffmpeg) and diffs the committed
      # README sections + every still. node is for gen-readme-check. gifsicle is
      # NOT needed: --check presence-checks the gif/clip jobs (gen-media.py skips
      # them before any gifsicle call); ffmpeg IS required (the site `space` crop).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ffmpeg
        # apt mirrors on hosted runners intermittently STALL — the bare one-liner
        # hung past the job timeout → smoke "cancelled" (hit ~3×). Bound each fetch
        # (http/https Timeout) so a dead mirror fails FAST instead of hanging, let
        # apt retry transient fetches (Acquire::Retries), and retry the whole
        # install up to 3× with backoff (apt fails on its OWN timeout, releasing the
        # dpkg lock, so a retry is safe — no SIGKILL). Install the FULL ffmpeg (no
        # --no-install-recommends): the trim isn't part of the fix and would make a
        # future gen-check op silently depend on the recommends set being present.
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get update "${apt_opts[@]}" \
              && sudo apt-get install -y "${apt_opts[@]}" ffmpeg; then
              # No `| head` — under `set -o pipefail` a closed pipe could SIGPIPE
              # ffmpeg and fail this success path. The full banner is fine in logs.
              ffmpeg -version
              exit 0
            fi
            echo "ffmpeg install attempt $attempt failed; retrying in $((attempt * 15))s..." >&2
            sleep "$((attempt * 15))"
          done
          echo "ffmpeg install failed after 3 attempts" >&2
          exit 1
      - name: Cache pip downloads
        # The venv itself is cheap to recreate; the wheel DOWNLOAD is the cost.
        # Cache ~/.cache/pip keyed on the pinned dep set so an unchanged
        # requirements-dev.txt reinstalls from cache instead of re-fetching PyPI.
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Artifact-drift gate (README sections + all rendered stills)
        run: just gen-check
      - name: Upload gen-check diff overlays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gen-check-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore
