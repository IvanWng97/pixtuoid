name: claude security review

on:
  # Chained after CI, so a head the full tier rejects never costs a review, and
  # a draft never reaches one: its ci-gate is red by design. The analysis loads
  # from the default branch and receives the PR diff only as inert data.
  workflow_run: # zizmor: ignore[dangerous-triggers] trusted-base caller; policy/ci-observability pins the read-only analyzer/publisher split
    workflows: [ci]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  security-review:
    if: >
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.login != 'dependabot[bot]' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/security-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/claude-readonly-review.yml
    with:
      pr_number: ${{ github.event.issue.number || 0 }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      head_repo: ${{ github.event.workflow_run.head_repository.full_name }}
      prompt_path: .github/prompts/security_review_rules.md
      review_marker: claude-security-review
      review_title: Claude Security Review
      max_turns: 40
      max_budget_usd: 8
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    concurrency:
      group: claude-security-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
