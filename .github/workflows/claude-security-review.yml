name: claude security review

on:
  # Like the general review, automatic security analysis is loaded from the
  # trusted default branch and receives the exact PR diff only as inert data.
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted-base caller; Conftest pins the read-only analyzer/publisher split
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  security-review:
    if: >
      (github.event_name == 'pull_request_target' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == github.event.repository.default_branch) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/security-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/claude-readonly-review.yml
    with:
      pr_number: ${{ github.event.issue.number || github.event.pull_request.number }}
      prompt_path: .github/prompts/security_review_rules.md
      review_marker: claude-security-review
      review_title: Claude Security Review
      max_turns: 40
      max_budget_usd: 8
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    concurrency:
      group: claude-security-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
