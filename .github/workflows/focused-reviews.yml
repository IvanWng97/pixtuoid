name: focused-reviews

# The merge gate's focused reviews (docs/CONTRIBUTING.md#the-merge-gate). A
# record posted later is judged by `gh run rerun <id>`, which re-reads the
# comments for this run's head.

on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}

jobs:
  focused-reviews:
    name: focused-reviews
    # A fork's or a bot's PR has no session to record; a job skipped by its
    # condition reports success to branch protection.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/focused-reviews.py --selftest
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/focused-reviews.py "$GITHUB_REPOSITORY" "$PR" "$HEAD"
