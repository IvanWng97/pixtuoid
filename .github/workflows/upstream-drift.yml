name: upstream-drift

# Weekly watch for upstream wire-format renames (hook event names, transcript
# event types, the subagent-dispatch tool) across all registered sources: they
# ship undocumented and silently disable decoding, so surface the next one
# before a user hits it.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
permissions: {}

jobs:
  drift:
    name: upstream wire-format drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      exit: ${{ steps.check.outputs.exit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          # A weekly interval meets GitHub's idle eviction
          # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching),
          # so a saved target dir would rarely be restored.
          enable-cache: 'false'

      - name: Check upstream drift
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          just drift-watch | tee drift-report.md
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.exit == '1'
        uses: actions/upload-artifact@v7
        with:
          name: drift-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: drift-report.md
          retention-days: 1
          if-no-files-found: error

      - name: Note transient check failure
        if: steps.check.outputs.exit == '2'
        run: echo "::warning::upstream-drift could not verify (transient network/HTTP); see report above."

      - name: Fail on an unexpected checker exit
        # exit 0 = no findings; 1 = actionable; 2 = transient fetch trouble
        # (warn-only by design). ANY other code — 101 (a panic or a failed
        # build), 137 (OOM-kill) — is a dead watcher, and without this it reads
        # as healthy.
        if: ${{ !contains(fromJSON('["0","1","2"]'), steps.check.outputs.exit) }}
        env:
          CODE: ${{ steps.check.outputs.exit }}
        run: |
          echo "::error::drift-watch exited with unexpected code '${CODE}'"
          exit 1

  file:
    name: file the drift report
    needs: drift
    if: needs.drift.outputs.exit == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: drift-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create upstream-drift --color FBCA04 \
            --description "Upstream CLI wire-format drift" 2>/dev/null || true
          # The checker owns the title and emits it as the report's H1; read it
          # back rather than re-deriving it. Re-deriving would be an unpinned
          # second copy of strings in drift_watch's `Report`, and rewording one
          # there would silently title a confirmed rename "could not verify".
          title=$(head -1 drift-report.md | sed 's/^# //')
          num=$(gh issue list --label upstream-drift --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            # Retitle on the dedup path too: the title carries the DISPOSITION,
            # so leaving week 1's on a thread week 2 turned into confirmed drift
            # makes the issue list actively mis-signal.
            gh issue edit "$num" --title "$title"
            gh issue comment "$num" --body-file drift-report.md
          else
            gh issue create \
              --title "$title" \
              --label upstream-drift \
              --body-file drift-report.md
          fi

      # Probe-health findings fail the run too, deliberately: a watch that cannot
      # see its upstream is dark, and a dark watch that stays green fails open.
      - name: Fail the run on any actionable finding
        run: exit 1
