name: raycast

on:
  # PR-only gate for the self-contained Raycast extension. The full `ray build`/
  # `ray lint` needs the macOS Raycast app, so it runs locally before publishing
  # rather than here.
  pull_request:
    paths: ['integrations/raycast/**', '.github/workflows/raycast.yml']

permissions:
  contents: read

concurrency:
  group: raycast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: types · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/raycast/package-lock.json
      - run: npm ci
      # Passes only while the live advisory set EQUALS the set adjudicated in
      # scripts/audit-adjudicated.mjs.
      - run: npm run audit
      # Each schema's own freshness vs its Rust struct is gated separately, by the
      # `*_schema_matches_the_committed_contract` tests in ci-tests.yml.
      - name: contract types match the committed schemas
        run: npm run gen:contract && git diff --exit-code src/contract.ts src/contract-outcome.ts
      - run: npx tsc --noEmit
      - run: npx eslint .
