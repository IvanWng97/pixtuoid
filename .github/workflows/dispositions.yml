name: dispositions

# Fails a PR whose disposition lines are not terminal as
# .claude/skills/two-lens-review/briefs.md defines them. It reads the PR's text
# through the API and never checks out or runs PR code.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  check:
    name: dispositions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dispositions-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check disposition lines
        shell: bash
        run: |
          set -euo pipefail
          authority=".claude/skills/two-lens-review/briefs.md"
          # Only a maintainer's comment or review disposes of a finding; a bot's
          # is a finding, and anyone else's must not be able to redden a PR.
          trusted='select(.user.type != "Bot" and (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))'
          # One assignment per source, so a failed fetch fails the step.
          body="$(gh api "repos/$GH_REPO/pulls/$PR" --jq '[.body // ""]')"
          comments="$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" --jq "[.[] | $trusted | .body // \"\"]")"
          reviews="$(gh api --paginate "repos/$GH_REPO/pulls/$PR/reviews" --jq "[.[] | $trusted | .body // \"\"]")"
          threads="$(gh api --paginate "repos/$GH_REPO/pulls/$PR/comments" --jq "[.[] | $trusted | .body // \"\"]")"
          docs="$(jq -s 'add' <<<"$body$comments$reviews$threads")"
          # A disposition STARTS its line with its state; the word anywhere else
          # is prose. A fence quotes, and each document opens unfenced.
          state='^[[:space:]]*([-*+][[:space:]]+|[0-9]+\.[[:space:]]+)?(\*\*)?(FIXED|REFUTED|RE-SCOPED|FOLLOW-UP|SURFACED)(\*\*)?([^[:alnum:]_-]|$)'
          bad=0
          for i in $(seq 0 $(($(jq length <<<"$docs") - 1))); do
              while IFS= read -r line; do
                  [[ "$line" =~ $state ]] || continue
                  case "${BASH_REMATCH[3]}" in
                  FIXED | REFUTED) continue ;;
                  SURFACED)
                      echo "::error::SURFACED is not a terminal disposition ($authority): $line"
                      bad=1
                      continue
                      ;;
                  esac
                  if [[ ! "$line" =~ (FOLLOW-UP|RE-SCOPED)(\*\*)?[[:space:]]*(→|->)[[:space:]]*#([0-9]+) ]]; then
                      echo "::error::this disposition names no → #N ($authority): $line"
                      bad=1
                      continue
                  fi
                  n="${BASH_REMATCH[4]}"
                  if [[ "$n" == "$PR" ]]; then
                      echo "::error::#$n is this PR, not its follow-up ($authority): $line"
                      bad=1
                      continue
                  fi
                  # An error here is the API's, so it fails with the API's message.
                  state_of="$(gh api "repos/$GH_REPO/pulls/$n" --jq 'if .merged_at then "merged" else .state end' 2>&1)" ||
                      state_of="not a PR ($state_of)"
                  case "$state_of" in
                  open | merged) ;;
                  *)
                      echo "::error::#$n is $state_of, not an open or merged PR ($authority): $line"
                      bad=1
                      ;;
                  esac
              done < <(jq -r --argjson i "$i" '.[$i]' <<<"$docs" |
                  awk '/^[[:space:]]*(```|~~~)/ { fenced = !fenced; next } !fenced')
          done
          exit "$bad"
