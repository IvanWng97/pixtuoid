name: risk radar

# Advisory, deterministic blast-radius surfacer (NOT a merge gate). On each PR
# it computes which high-risk seams the diff touches (pure path matching, no
# LLM) and posts a sticky checklist of the documented review escalations, so a
# prose-only escalation is stated outright instead of being missed. Never blocks
# merge; degrades to the step summary when the token can't comment (fork PRs).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: risk-radar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4

      # The gate on the seam map itself: edit scripts/risk-radar.py and break a
      # rule, this fails first. Via the recipe — CI calls what local dev calls.
      - name: Self-test the matcher
        run: just risk-radar-test

      # continue-on-error: a transient `gh pr diff` hiccup must not redden an
      # advisory, non-required job. Without pipefail the pipeline reports
      # python3's status, so a failed diff reads as success on empty input and
      # prints the same confident "no seams touched" as a genuinely clean diff.
      - name: Compute risk radar
        id: compute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if gh pr diff "$PR" --name-only | python3 scripts/risk-radar.py >radar.md; then
            {
              echo "## Risk radar"
              if [ -s radar.md ]; then cat radar.md; else echo "_No high-blast-radius seams touched._"; fi
            } >>"$GITHUB_STEP_SUMMARY"
          else
            # Not a verdict: discard the partial file so nothing downstream reads it.
            rm -f radar.md
            {
              echo "## Risk radar"
              echo "_Could not read the pull-request diff — radar not computed._"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Only upsert when the radar was actually computed, else the empty-body
      # branch wrongly deletes the existing comment. Soft: a read-only fork
      # token can't comment anyway.
      - name: Upsert sticky PR comment
        if: steps.compute.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/risk-radar-upsert.sh "$PR" radar.md
