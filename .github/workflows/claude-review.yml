name: claude review

on:
  # Chained after CI, so a head the full tier rejects never costs a review, and
  # a draft never reaches one: its ci-gate is red by design. This file and the
  # reusable workflow load from the default branch, which never checks out or
  # executes the PR head.
  workflow_run: # zizmor: ignore[dangerous-triggers] trusted-base caller; policy/ci-observability pins the read-only analyzer/publisher split
    workflows: [ci]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: >
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.login != 'dependabot[bot]' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/claude-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/claude-readonly-review.yml
    with:
      pr_number: ${{ github.event.issue.number || 0 }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      head_repo: ${{ github.event.workflow_run.head_repository.full_name }}
      prompt_path: .github/prompts/pr_review_rules.md
      review_marker: claude-auto-review
      review_title: Claude Review
      max_turns: 60
      max_budget_usd: 10
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
