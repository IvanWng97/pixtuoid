name: site

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a PR outside the merge queue: only the jobs without `if: inputs.full` run'
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  # The checks that need no rendered demos run on every PR push.
  lint:
    name: format · lint · types · unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-site-node
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run knip
      - run: npm run test:unit

  check:
    name: demos · build · e2e
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    # A cold gen-demos (release build plus encodes) on top of a cold gen-wasm.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # the displayed version is the latest release TAG — a shallow, tag-less
          # checkout silently falls back to Cargo.toml
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-site-node
      - uses: ./.github/actions/gen-demos
      - run: npm run test:demos
      - uses: ./.github/actions/gen-wasm
      - run: npm run build
        env:
          GH_STARS_E2E: 1
      # the empty-render guard runs in the PR gate, not only `verify`/deploy, so a
      # collapsed doc render is caught pre-merge (#680).
      - run: npm run check:docs
      # Only e2e needs Playwright's Chromium (lighthouse rides chrome-launcher's
      # system Chrome) and the diagram renders in-process, so Chromium lands here,
      # not in the composite pages.yml also runs.
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - run: npm run e2e
      - run: npm run lighthouse
      # The run logs carry only failing scores, not element-level violations.
      # `path` is workspace-root-relative, hence the site/ prefix despite the job cwd.
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: site/.lighthouseci/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  required:
    name: required-site-jobs
    if: ${{ always() }}
    needs: [check, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "Required site job failed"
          allow-skipped: ${{ !inputs.full }}
