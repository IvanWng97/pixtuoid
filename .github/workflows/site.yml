name: site

on:
  # site/ also renders ../Cargo.toml (the displayed version), ../docs/CONFIGURATION.md
  # (the /config page), and ../docs/ARCHITECTURE.md (the /architecture page, whose
  # ```mermaid block is rendered to an inline SVG at build) — so a change to any of
  # them must run this CI too, otherwise a broken build slips through.
  push:
    branches: [main]
    paths: ['site/**', 'Cargo.toml', 'docs/CONFIGURATION.md', 'docs/ARCHITECTURE.md', '.github/workflows/site.yml', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'Cargo.toml', 'docs/CONFIGURATION.md', 'docs/ARCHITECTURE.md', '.github/workflows/site.yml', '.github/workflows/pages.yml']

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · types · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # the /architecture page renders its ```mermaid block to an inline SVG at
      # build via rehype-mermaid (Playwright) — needs a headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
