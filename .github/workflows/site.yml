name: site

on:
  # PR-only: pages.yml owns the on-main build + deploy, so a main push here would
  # be a redundant 2nd Astro build. README drift is gated by ci-lint.yml's
  # `readme` job instead, so README.md is deliberately absent from the paths.
  pull_request:
    paths: ['site/**', 'Cargo.toml', 'docs/CONFIGURATION.md', 'docs/ARCHITECTURE.md', 'docs/CONTRIBUTING.md', 'docs/PARALLEL-DELIVERY.md', '.github/workflows/site.yml', '.github/workflows/pages.yml', '.github/actions/setup-site-node/**']

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: audit · format · lint · types · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # the displayed version is the latest release TAG — a shallow, tag-less
          # checkout silently falls back to Cargo.toml
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-site-node
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run knip
      - run: npm run test:unit
      # pin the ★ count: the runner's unauthenticated GitHub API call rate-limits
      # to null, hiding the star chip and silently no-op-ing the e2e assertion.
      - run: npm run build
        env:
          GH_STARS_OVERRIDE: 842
      # the empty-render guard runs in the PR gate, not only `verify`/deploy, so a
      # collapsed doc render is caught pre-merge (#680).
      - run: npm run check:docs
      - run: npm run e2e
      - run: npm run lighthouse
      # LAST: it resolves advisories live, so at step one someone else's publish
      # skips every check below it (#847/#849). pages.yml keeps it first — it ships.
      - run: npm run audit
      # The run logs carry only failing scores, not element-level violations.
      # `path` is workspace-root-relative, hence the site/ prefix despite the job cwd.
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: site/.lighthouseci/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
