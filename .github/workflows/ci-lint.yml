name: ci-lint

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: rustfmt
          enable-cache: 'false'
      - run: just fmt-check
      - run: just arch

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The default-on audio feature compiles through ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: clippy
      - run: just clippy

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No setup-cargo-just: nothing compiles here, so the runner's preinstalled
      # cargo is enough — but cargo-deny DOES shell out to `cargo metadata`.
      - uses: taiki-e/install-action@cargo-deny
      - uses: ./.github/actions/setup-just
      - run: just deny

  machete:
    name: unused deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # cargo-machete parses manifests and does not need a Rust toolchain.
      - uses: taiki-e/install-action@cargo-machete
      - uses: ./.github/actions/setup-just
      - run: just machete

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Lychee is not manifest-managed by install-action, so its documented
      # cargo-binstall fallback installs our pinned version.
      - name: Install workflow lint + policy tools
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/mikefarah/yq/v4@v4.53.3
          CGO_ENABLED=0 go install github.com/open-policy-agent/conftest@v0.68.2
          # conftest embeds OPA but exposes neither `check` nor test coverage, so
          # the OPA binary owns both.
          go install github.com/open-policy-agent/opa@v1.18.2
          go install github.com/open-policy-agent/regal@v0.42.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install the JSON Schema validator
        run: pipx install check-jsonschema==0.37.4
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.24.2,zizmor@1.30.0
          fallback: cargo-binstall
      - uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@0.11.0
          fallback: none
      # `just fixture-pii` is a REQUIRED gate and cannot degrade — a missing
      # gitleaks must fail the job, not silently scan nothing. Not via
      # taiki-e/install-action: gitleaks is not in its TOOLS.md (checked).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver=8.30.1
          url="https://github.com/gitleaks/gitleaks/releases/download/v$ver/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - uses: ./.github/actions/setup-just
      - run: just shfmt-check
      - run: just shellcheck
      - run: just actionlint
      - run: just actionlint-composites
      - run: just zizmor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just ci-observability
      - run: just json-schemas
      - run: just links
      - run: just drift-selftest
      - run: just env-paths
      - run: just tuidrive-selftest
      - run: just e2e-scrub-selftest
      - run: just star-history-selftest
      # `just fixture-metadata` is NOT here: it became Rust tests in #929, so it
      # already rides `just test` in windows-test, macos-test and coverage —
      # three platforms instead of this job's one, and no toolchain in a lint job.
      - run: just fixture-pii
      - run: just fixture-pii-selftest

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The default-on audio feature must compile through ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # No rust-cache on purpose: it would key the runner's stable compiler,
      # while the MSRV recipe installs the exact rust-version toolchain.
      - uses: ./.github/actions/setup-just
      - run: just msrv

  notes-curated:
    name: release notes curated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      - run: just notes-curated

  npm-gen:
    name: npm package generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Exercise the generator before release.yml uses it to publish.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-just
      - run: just npm-check

  readme:
    name: readme drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Deliberately here rather than in the path-filtered site workflow, so it
      # can be a required check.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./.github/actions/setup-just
      - run: just gen-readme-check

  # cargo-public-api complements semver: one classifies compatibility, while
  # this golden shows the exact public surface change.
  api-surface:
    name: api-surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install cargo-public-api (pinned to match the committed goldens)
        run: cargo binstall -y cargo-public-api@0.52.0
      - uses: ./.github/actions/setup-just
      - run: just api-surface-check

  # rustdoc warnings and doctests are invisible to clippy and nextest.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The default-on audio feature must compile through ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/setup-cargo-just
      - run: just doc-check

  required:
    name: required-lint-jobs
    # This explicit manifest prevents a nested job deletion or rename from
    # silently shrinking the single protected ci-gate.
    if: ${{ always() }}
    needs: [fmt, clippy, deny, machete, hygiene, msrv, notes-curated, npm-gen, readme, api-surface, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lint job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$RESULTS")"
          if [[ -n "$failures" ]]; then
            echo "::error::Required lint job failed: ${failures//$'\n'/, }"
            exit 1
          fi
