name: star-history

# Draws the README's star chart and force-pushes it as ONE orphan commit on the
# `star-history` branch (the branch never grows; main never sees a bot commit).
# Why self-hosted (the 2026-06-30 stargazers restriction): the docstring of
# scripts/star-history.py. `watch` refreshes on each new star —
# `cancel-in-progress` folds a burst into one run — the cron keeps the right
# edge current on quiet days, and the `push` arm republishes the moment the
# renderer or this file changes on main (it is also the first run after merge).

on:
  schedule:
    - cron: "23 4 * * *" # daily 04:23 UTC
  watch:
    types: [started]
  push:
    branches: [main]
    paths:
      - scripts/star-history.py
      - scripts/star-history-palette.json
      - .github/workflows/star-history.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  chart:
    name: render and publish
    # A fork would force-push a `star-history` branch into its own repo on every cron.
    if: github.repository == 'IvanWng97/pixtuoid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Guards the renderer before the live run trusts it; ci-lint's hygiene
      # job runs the same gate but not on the cron or the watch event.
      - name: Self-test the renderer
        run: python3 scripts/star-history.py --selftest

      - name: Render the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/star-history.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/chart"

      - name: Publish to the star-history branch
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/chart
        run: |
          set -euo pipefail
          git init --quiet --initial-branch=star-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet -m "chart: star history as of $(date -u +%F)"
          # Auth as actions/checkout does (src/git-auth-helper.ts: the
          # http.<origin>/.extraheader basic credential), but via git's
          # env-config so the token lands in neither argv nor a file.
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git push --force --quiet "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/star-history
