name: ci-tests

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a PR outside the merge queue: the Windows and macOS tests and the `if: inputs.full` jobs skip'
        type: boolean
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The test platforms, listed once; the light tier keeps Linux. The full tier
  # adds what the Linux entry compiles out: Windows (pipes, atomic-write retries;
  # windows-latest is tracked to catch hosted-image changes) and macos-14 (Apple
  # Silicon, BSD CLI, launchd, config paths). A job output, not include/exclude:
  # `include` is applied after `exclude` and re-adds what it excluded
  # (github/docs workflow-syntax.md, jobs.<job_id>.strategy.matrix).
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          FULL: ${{ inputs.full }}
          ALL: >-
            [{"platform": "linux", "runner": "ubuntu-latest", "flag": "unit", "timeout": 25},
             {"platform": "windows", "runner": "windows-latest", "flag": "windows", "timeout": 25},
             {"platform": "macos", "runner": "macos-14", "flag": "macos", "timeout": 20}]
        run: |
          echo "include=$(jq -c --argjson full "$FULL" \
            'if $full then . else map(select(.platform == "linux")) end' <<< "$ALL")" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.platform }}-test
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    # nextest owns per-test hang limits.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: llvm-tools-preview
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage + JUnit XML (single instrumented test run)
        run: just coverage
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          file: lcov.info
          flag: ${{ matrix.flag }}
          report_type: coverage
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-codecov
        with:
          file: target/nextest/ci/junit.xml
          flag: ${{ matrix.flag }}
          report_type: test_results

  snapshots:
    name: snapshot hygiene
    # Declared, not inherited: an omitted block would take the caller's
    # id-token: write and hand this job a repo-scoped OIDC minting capability.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - uses: taiki-e/install-action@cargo-nextest
      - uses: taiki-e/install-action@cargo-insta
      # An uninstrumented run lets insta detect pending and orphan snapshots.
      - run: just snapshots

  smoke:
    name: smoke
    if: ${{ inputs.full }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - name: Build release binaries + examples
        run: just build --release --bins --examples
      - name: pixtuoid --help exits 0
        run: ./target/release/pixtuoid --help
      - name: pixtuoid-hook exits 0 with no socket
        # Release-profile coverage of invariant #5: always exit zero silently.
        run: |
          out=$(echo '{}' | ./target/release/pixtuoid-hook 2>&1)
          test -z "$out"
          echo "hook shim exited 0 silently (expected no-op with no socket)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      # Evidence, not a gate: a look-changing PR doesn't commit media, and the
      # generated-art lens reads the overlays below.
      - name: README media drift (evidence)
        continue-on-error: true
        run: just gen-media-check
      - name: Upload gen-check diff overlays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gen-check-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: required-test-jobs
    permissions:
      contents: read
    # Explicit membership keeps a deleted or renamed nested job from letting the
    # single protected ci-gate silently lose coverage.
    if: ${{ always() }}
    needs:
      [platforms, test, snapshots, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "Required test job failed"
          allow-skipped: ${{ !inputs.full }}
