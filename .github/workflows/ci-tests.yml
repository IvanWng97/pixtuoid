name: ci-tests

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-test:
    name: windows-test
    # Track windows-latest deliberately: this gate catches hosted-image changes.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - run: just test
        env:
          NEXTEST_PROFILE: ci
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-codecov
        with:
          file: target/nextest/ci/junit.xml
          flag: windows
          report_type: test_results

  macos-test:
    name: macos-test
    # macos-14 exercises the Apple Silicon build; macOS diverges on BSD CLI,
    # launchd, and config paths.
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - run: just test
        env:
          NEXTEST_PROFILE: ci
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-codecov
        with:
          file: target/nextest/ci/junit.xml
          flag: macos
          report_type: test_results

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The default-on audio feature must compile through ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Generate coverage + JUnit XML (single test run)
        run: just coverage
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          file: lcov.info
          flag: unit
          report_type: coverage
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-codecov
        with:
          file: target/nextest/ci/junit.xml
          flag: unit
          report_type: test_results

  # Platform coverage compiles code the Linux job cannot see: Windows pipes and
  # atomic-write retries, plus macOS paths and launchd.
  coverage-windows:
    name: coverage-windows
    runs-on: windows-latest
    # nextest owns per-test hang limits.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: llvm-tools-preview
      # rust-cache separates this from windows-test by job ID and RUSTFLAGS.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage + JUnit XML (single instrumented test run)
        run: just coverage
      # lcov only: windows-test already uploads this platform's JUnit report.
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          file: lcov.info
          flag: windows
          report_type: coverage

  coverage-macos:
    name: coverage-macos
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: llvm-tools-preview
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage + JUnit XML (single instrumented test run)
        run: just coverage
      # lcov only: macos-test already uploads this platform's JUnit report.
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          file: lcov.info
          flag: macos
          report_type: coverage

  snapshots:
    name: snapshot hygiene
    # Declared, not inherited: an omitted block would take the caller's
    # id-token: write and hand this job a repo-scoped OIDC minting capability.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Snapshot tests compile the default-on audio feature on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/setup-cargo-just
      - uses: taiki-e/install-action@cargo-nextest
      - uses: taiki-e/install-action@cargo-insta
      # An uninstrumented run lets insta detect pending and orphan snapshots.
      - run: just snapshots

  smoke:
    name: smoke
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The release build compiles the default-on audio feature on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: ./.github/actions/setup-cargo-just
      - name: Build release binaries + examples
        run: just build --release --bins --examples
      - name: pixtuoid --help exits 0
        run: ./target/release/pixtuoid --help
      - name: pixtuoid-hook exits 0 with no socket
        # Release-profile coverage of invariant #5: always exit zero silently.
        run: |
          out=$(echo '{}' | ./target/release/pixtuoid-hook 2>&1)
          test -z "$out"
          echo "hook shim exited 0 silently (expected no-op with no socket)"
      # gen-check needs Node, Pillow, and ffmpeg, but not gifsicle in check mode.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ffmpeg
        # Bound flaky hosted-runner mirrors and retry the complete apt operation;
        # do not pipe the version command through head under pipefail.
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo apt-get update "${apt_opts[@]}" \
              && sudo apt-get install -y "${apt_opts[@]}" ffmpeg; then
              ffmpeg -version
              exit 0
            fi
            echo "ffmpeg install attempt $attempt failed; retrying in $((attempt * 15))s..." >&2
            sleep "$((attempt * 15))"
          done
          echo "ffmpeg install failed after 3 attempts" >&2
          exit 1
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Artifact-drift gate (README sections + all rendered stills)
        run: just gen-check
      - name: Upload gen-check diff overlays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gen-check-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: required-test-jobs
    permissions:
      contents: read
    # Explicit membership keeps a deleted or renamed nested job from letting the
    # single protected ci-gate silently lose coverage.
    if: ${{ always() }}
    needs:
      [windows-test, macos-test, coverage, coverage-windows, coverage-macos, snapshots, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$RESULTS")"
          if [[ -n "$failures" ]]; then
            echo "::error::Required test job failed: ${failures//$'\n'/, }"
            exit 1
          fi
