name: ci-tests

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a draft PR: only the jobs without `if: inputs.full` run'
        type: boolean
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.platform }}-test
    if: ${{ inputs.full }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            flag: unit
            timeout: 25
          # Track windows-latest deliberately: this gate catches hosted-image
          # changes. Its coverage sees the Windows pipes and atomic-write
          # retries the Linux entry compiles out.
          - platform: windows
            runner: windows-latest
            flag: windows
            timeout: 25
          # macos-14 exercises the Apple Silicon build; macOS diverges on BSD
          # CLI, launchd, and config paths, which the Linux entry compiles out.
          - platform: macos
            runner: macos-14
            flag: macos
            timeout: 20
    runs-on: ${{ matrix.runner }}
    # nextest owns per-test hang limits.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: llvm-tools-preview
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage + JUnit XML (single instrumented test run)
        run: just coverage
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          file: lcov.info
          flag: ${{ matrix.flag }}
          report_type: coverage
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-codecov
        with:
          file: target/nextest/ci/junit.xml
          flag: ${{ matrix.flag }}
          report_type: test_results

  snapshots:
    name: snapshot hygiene
    # Declared, not inherited: an omitted block would take the caller's
    # id-token: write and hand this job a repo-scoped OIDC minting capability.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - uses: taiki-e/install-action@cargo-nextest
      - uses: taiki-e/install-action@cargo-insta
      # An uninstrumented run lets insta detect pending and orphan snapshots.
      - run: just snapshots
      # Review evidence (scripts/test-list-diff.py), listed from the build
      # above; advisory, so a missing artifact never reds the gate. On a PR the
      # checkout is the merge commit, so its parents name the main commit whose
      # list is the base.
      - name: List the tests
        id: test-list
        continue-on-error: true
        run: |
          mkdir -p target/test-list
          cargo nextest list --workspace --message-format json > target/test-list/tests.json
          git cat-file -p HEAD | sed -n 's/^parent //p' > target/test-list/parents.txt
      # `outcome` is the step's result before continue-on-error, so a failed
      # listing uploads nothing rather than a partial list.
      - if: steps.test-list.outcome == 'success'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: test-list
          path: target/test-list/
          retention-days: 30
          if-no-files-found: error

  smoke:
    name: smoke
    if: ${{ inputs.full }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - name: Build release binaries + examples
        run: just build --release --bins --examples
      - name: pixtuoid --help exits 0
        run: ./target/release/pixtuoid --help
      - name: pixtuoid-hook exits 0 with no socket
        # Release-profile coverage of invariant #5: always exit zero silently.
        run: |
          out=$(echo '{}' | ./target/release/pixtuoid-hook 2>&1)
          test -z "$out"
          echo "hook shim exited 0 silently (expected no-op with no socket)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Source drift gate (generated sprites and icons, README sections, the comparator)
        run: just compare-selftest gen-readme-check gen-art-check gen-icons-check
      # Evidence, not a gate: a look-changing PR doesn't commit media, and the
      # generated-art lens reads the overlays below.
      - name: README media drift (evidence)
        continue-on-error: true
        run: just gen-media-check
      - name: Upload gen-check diff overlays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gen-check-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: required-test-jobs
    permissions:
      contents: read
    # Explicit membership keeps a deleted or renamed nested job from letting the
    # single protected ci-gate silently lose coverage.
    if: ${{ always() }}
    needs:
      [test, snapshots, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "Required test job failed"
