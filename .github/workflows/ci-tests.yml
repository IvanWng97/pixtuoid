name: ci-tests

on:
  workflow_call:
    inputs:
      full:
        description: 'False on a PR outside the merge queue: only the jobs without `if: inputs.full` run'
        type: boolean
        required: true
    secrets:
      MERGIFY_TOKEN:
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Unit tests on every platform run on every PR push
  # (docs.mergify.com/merge-queue/two-step: the preliminary step runs
  # "linters, formatters, unit tests, basic compile checks").
  test:
    name: ${{ matrix.platform }}-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            flag: unit
            timeout: 25
          # Track windows-latest deliberately: this gate catches hosted-image
          # changes. It runs the Windows pipes and atomic-write retries the Linux
          # entry compiles out, and the full tier measures their coverage.
          - platform: windows
            runner: windows-latest
            flag: windows
            timeout: 25
          # macos-14 exercises the Apple Silicon build; macOS diverges on BSD
          # CLI, launchd, and config paths, which the Linux entry compiles out.
          - platform: macos
            runner: macos-14
            flag: macos
            timeout: 20
    runs-on: ${{ matrix.runner }}
    # nextest owns per-test hang limits.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      id-token: write
    env:
      # A fork's PR gets no secrets; its results simply aren't uploaded.
      HAS_MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
        with:
          components: ${{ inputs.full && 'llvm-tools-preview' || '' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      # Coverage instruments the whole build, so it is the full tier's: a PR's
      # pushes run the plain suite, and the queue and main measure coverage.
      - name: Unit tests + JUnit XML
        id: tests
        if: ${{ !inputs.full }}
        run: just test --profile ci
      - name: Install cargo-llvm-cov
        if: ${{ inputs.full }}
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage + JUnit XML (single instrumented test run)
        id: coverage
        if: ${{ inputs.full }}
        run: just coverage
      - name: Upload coverage to Codecov
        if: ${{ inputs.full }}
        uses: ./.github/actions/upload-codecov
        with:
          file: lcov.info
          flag: ${{ matrix.flag }}
      - name: Upload test results to Mergify CI Insights
        if: ${{ !cancelled() && env.HAS_MERGIFY_TOKEN == 'true' }}
        uses: Mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: target/nextest/ci/junit.xml
          job_name: ${{ matrix.platform }}-test
          test_step_outcome: ${{ inputs.full && steps.coverage.outcome || steps.tests.outcome }}

  snapshots:
    name: snapshot hygiene
    # Declared, not inherited: an omitted block would take the caller's
    # id-token: write and hand this job a repo-scoped OIDC minting capability.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - uses: taiki-e/install-action@cargo-nextest
      - uses: taiki-e/install-action@cargo-insta
      # An uninstrumented run lets insta detect pending and orphan snapshots.
      - run: just snapshots

  smoke:
    name: smoke
    if: ${{ inputs.full }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-alsa
      - uses: ./.github/actions/setup-cargo-just
      - name: Build release binaries + examples
        run: just build --release --bins --examples
      - name: pixtuoid --help exits 0
        run: ./target/release/pixtuoid --help
      - name: pixtuoid-hook exits 0 with no socket
        # Release-profile coverage of invariant #5: always exit zero silently.
        run: |
          out=$(echo '{}' | ./target/release/pixtuoid-hook 2>&1)
          test -z "$out"
          echo "hook shim exited 0 silently (expected no-op with no socket)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      # Evidence, not a gate: a look-changing PR doesn't commit media, and the
      # generated-art lens reads the overlays below.
      - name: README media drift (evidence)
        continue-on-error: true
        run: just gen-media-check
      - name: Upload gen-check diff overlays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gen-check-diffs
          path: target/gen-check-diff/
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: required-test-jobs
    permissions:
      contents: read
    # Explicit membership keeps a deleted or renamed nested job from letting the
    # single protected ci-gate silently lose coverage.
    if: ${{ always() }}
    needs:
      [test, snapshots, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          results: ${{ toJSON(needs) }}
          label: "Required test job failed"
          allow-skipped: ${{ !inputs.full }}
