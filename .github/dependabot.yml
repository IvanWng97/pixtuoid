version: 2
updates:
  - package-ecosystem: cargo
    # A RED cargo run does not mean the lane stopped: dependabot-core updates one
    # package at a time, so a release that needs a LOCKSTEP SIBLING bump
    # (serde -> serde_core/serde_derive; toml/toml_edit -> toml_writer) leaves the
    # regenerated lock unchanged and `cargo/file_updater/lockfile_updater.rb:76`
    # raises `unknown_error`. The group loop skips that dependency and still opens
    # the PR for the rest — #624 and #761 were both cut from red runs. The remedy
    # is a human `cargo update -p <crate>`; the advisory axis is covered
    # independently by audit.yml's daily `cargo-deny check advisories`.
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # objc2-app-kit MUST track winit's stack (see crates/pixtuoid/Cargo.toml):
      # winit 0.30.x still pulls 0.2.x on objc2 0.5.x, so a 0.3+ bump would build
      # a SECOND objc2 stack beside winit's AND break the activate API. Allow only
      # 0.2.x patch bumps until winit itself moves to objc2 0.6.
      - dependency-name: "objc2-app-kit"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    # `directory: /` searches ONLY `.github/workflows` plus a root `action.yml`,
    # so every third-party pin that #784/#785 moved into a composite left
    # Dependabot's map. The second entry is the form dependabot-core#6704
    # confirms works — `/.github/actions/*`, not `/.github/actions/*/action.yml`,
    # which silently degrades back to workflows-only. `policy/ci-observability`
    # denies a composite pin no declared directory covers.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # This repo pins actions to a FLOATING major (`@v4`), which .github/zizmor.yml
      # records as deliberate policy — the tag already tracks the newest release, so
      # patch/minor updates arrive without a PR. Dependabot reads `@v4` as "version
      # 4" and, filtered by the cooldown below, offers the newest version that is a
      # week OLD — rewriting the self-updating ref into a stale exact pin. #786 did
      # exactly that: `@v1` (then v1.0.183) -> v1.0.178, `@v4` (then v4.37.3) ->
      # v4.37.1. Both downgrades. Only a MAJOR bump needs a human, so only majors
      # should open a PR.
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]
    cooldown:
      default-days: 7

  # The two Node projects previously had security ALERTS but no update PRs —
  # npm advisories surfaced with nothing offering the fix.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      # playwright + @playwright/test must bump together (version-locked pair)
      playwright:
        patterns: ["playwright", "@playwright/*"]
      site-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # typescript major (→7) is peer-rejected by @astrojs/check (peers
      # typescript ^5||^6) and typescript-eslint (<6.1.0), so `npm ci` ERESOLVEs.
      # Stay on 6.x until the astro-check + eslint toolchain supports TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /integrations/raycast
    schedule:
      interval: weekly
    groups:
      raycast-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # @raycast/api peers @types/node EXACTLY (22.19.17 — Raycast's runtime is
      # Node 22); a major ahead of that types APIs the runtime doesn't have.
      # Bump only when @raycast/api's own peer pin moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript major (→7) is peer-rejected by @raycast/eslint-config's
      # typescript-eslint (peers typescript <6.1.0), so `npm ci` ERESOLVEs. Stay
      # on 6.x until the eslint toolchain supports TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
