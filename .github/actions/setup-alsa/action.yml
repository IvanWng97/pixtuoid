name: 'Setup ALSA'
description: 'Installs the ALSA headers the default-on audio feature needs on Linux'

runs:
  using: 'composite'
  steps:
    # alsa-sys's build script PANICS when pkg-config can't find the headers
    # (#633), so this rides every Linux job that compiles the workspace.
    - name: Install ALSA headers
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev
