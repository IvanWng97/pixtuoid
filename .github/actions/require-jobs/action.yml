name: 'Require Jobs'
description: 'Fails unless every needed job succeeded — skipped (unless allowed) and cancelled red too'

inputs:
  results:
    description: 'toJSON(needs) of the calling aggregator job'
    required: true
  label:
    description: 'Failure-message prefix naming the group'
    required: true
  allow-skipped:
    description: "'true' lets a skipped job pass: only a light-tier run, whose full-tier jobs skip by design, may pass it"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        LABEL: ${{ inputs.label }}
        ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
      run: |
        # `required: true` on an input is advisory — a caller that omits it
        # hands us an empty string, and an empty needs-map would pass vacuously.
        if [[ -z "$RESULTS" || "$RESULTS" == "{}" ]]; then
          echo "::error::${LABEL:-require-jobs}: no job results — the caller must pass results: toJSON(needs)"
          exit 1
        fi
        # Any spelling but exactly `true` stays strict.
        failures="$(jq -r --arg allow_skipped "$ALLOW_SKIPPED" '
          to_entries[]
          | select(.value.result != "success")
          | select($allow_skipped != "true" or .value.result != "skipped")
          | "\(.key)=\(.value.result)"' <<< "$RESULTS")"
        if [[ -n "$failures" ]]; then
          echo "::error::${LABEL}: ${failures//$'\n'/, }"
          exit 1
        fi
