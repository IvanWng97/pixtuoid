name: 'Setup Cargo & Just'
description: 'Sets up Rust toolchain, rust-cache, and just'

inputs:
  components:
    description: 'Comma-separated list of toolchain components'
    required: false
    default: ''
  targets:
    description: 'Comma-separated list of target triples'
    required: false
    default: ''
  enable-cache:
    description: 'Whether to enable Swatinem/rust-cache'
    required: false
    default: 'true'
  shared-key:
    description: 'Swatinem/rust-cache shared-key; empty keys the cache by job'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # Keep this prefix fixed so every Rust job shares one cache namespace; a bump
    # is a deliberate repository-wide invalidation.
    - if: ${{ inputs.enable-cache == 'true' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: v1-rust
        shared-key: ${{ inputs.shared-key }}

    - uses: ./.github/actions/setup-just
