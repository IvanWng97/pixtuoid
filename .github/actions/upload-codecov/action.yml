name: Upload coverage to Codecov
description: Require a generated report and make advisory upload failures visible

inputs:
  file:
    description: Repository-relative report path
    required: true
  flag:
    description: Codecov flag for this report
    required: true

runs:
  using: composite
  steps:
    - name: Require a generated report
      shell: bash
      env:
        REPORT_FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        if [[ ! -s "$REPORT_FILE" ]]; then
          echo "::error title=Missing generated report::$REPORT_FILE is missing or empty"
          exit 1
        fi
        echo "$REPORT_FILE=$(wc -c < "$REPORT_FILE")B"

    - name: Upload report
      id: upload
      continue-on-error: true
      uses: codecov/codecov-action@v7
      with:
        files: ${{ inputs.file }}
        flags: ${{ inputs.flag }}
        report_type: coverage
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
        use_oidc: true

    - name: Surface advisory upload failure
      if: ${{ steps.upload.outcome == 'failure' }}
      shell: bash
      env:
        REPORT_FILE: ${{ inputs.file }}
        REPORT_FLAG: ${{ inputs.flag }}
      run: |
        message="Codecov coverage upload failed for $REPORT_FILE (flag: $REPORT_FLAG); the report was generated, so this external-service failure is advisory."
        echo "::warning title=Codecov upload failed::$message"
        {
          echo "### Codecov upload warning"
          echo
          echo "$message"
          echo
          echo "Inspect the **Upload report** step above for the uploader error."
        } >> "$GITHUB_STEP_SUMMARY"
