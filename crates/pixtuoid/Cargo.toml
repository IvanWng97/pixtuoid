[package]
name                   = "pixtuoid"
description            = "Terminal pixel-art office for AI coding agents"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

[lints]
workspace = true

[[bin]]
name = "pixtuoid"
path = "src/main.rs"

[dependencies]
pixtuoid-core  = { path = "../pixtuoid-core", version = "0.16.0" }
pixtuoid-scene = { path = "../pixtuoid-scene", version = "0.16.0" }
# AA text rasterizer (Monaspace Neon) for the binary's pixel surfaces. Its
# per-pixel coverage callback (`OutlinedGlyph::draw`) suits our callback-based
# `aa_text::draw_text_at` better than fontdue's raw-bitmap API. Binary-only: the
# wasm-compiled engine never sees it, and renders text as a DOM overlay instead.
ab_glyph = "0.2"
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs", "io-util"] }
ratatui            = { workspace = true }
# Terminal graphics (kitty/iTerm2/SIXEL) for the cutaway profile — capability
# query, cell-size query, and the four protocol encoders. In the ratatui org,
# so it tracks ratatui's own releases. `default-features = false` is
# LOAD-BEARING: the default set turns on `chafa-dyn`, which dynamically links
# libchafa.so and needs it at RUNTIME too — that would break the musl/cross
# Linux prebuilds exactly the way ALSA already does (see the `audio` feature).
# Its sixel backend is `icy_sixel`, pure Rust, so the trimmed set has no C dep.
ratatui-image      = { version = "11", default-features = false, features = ["crossterm"] }
crossterm          = { workspace = true }
unicode-width      = { workspace = true }
clap               = { workspace = true }
serde              = { workspace = true }
# `preserve_order` is enabled HERE, not workspace-wide: config merges are a
# READ→MERGE→WRITE round-trip and serde_json's default BTreeMap-backed `Map`
# re-emits every object ALPHABETICALLY, silently reordering the user's own
# hand-authored file on a `connect`. Scoped to this crate so `pixtuoid-web` need
# not pay indexmap's code size in the committed wasm artifact.
serde_json         = { workspace = true, features = ["preserve_order"] }
toml               = { workspace = true }
toml_edit          = { workspace = true }
# YAML parse+emit for the Hermes install target. The maintained yaml-rust
# successor (serde_yaml/serde_yml are both abandoned); it data-preserves a user's
# other config keys on merge but does NOT round-trip comments.
saphyr             = "0.0.11"
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
which              = "8"
# clock feature gives us Local::now() w/ system timezone for the wall clock.
chrono             = { version = "0.4", default-features = false, features = ["clock"] }
open               = "5"
# The `pixtuoid floating` desktop window (binary-only — pixtuoid-core stays
# window-free): winit is the frameless always-on-top window + main-thread event
# loop, softbuffer the CPU blit of the office RgbBuffer into it (no GPU).
winit              = "0.30"
softbuffer         = "0.4"
clap_complete = "4.6.5"
clap_mangen = "0.3.0"

# Ambient office audio: rodio's playback half only (cpal underneath) — no decoder
# features, every sound is synthesized into raw sample buffers at startup.
# Optional so `--no-default-features` builds a silent binary (and skips cpal's
# Linux ALSA system-header requirement). `tracing` routes rodio's OWN diagnostics
# to `tracing::error!/debug!` instead of its default `eprintln!` — a raw stderr
# write mid-altscreen corrupts the TUI.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "tracing"], optional = true }

[features]
default = ["audio"]
# Ambient sound (config-OFF at runtime regardless; this gates the DEPENDENCY).
audio = ["dep:rodio"]

# termios/poll for the truecolor preflight's DECRQSS terminal query (term.rs).
# Same 0.2 as pixtuoid-core/hook — no second build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Focus-jump activation (focus/macos.rs). Pinned to the SAME objc2 stack winit
# already pulls so the bindings don't double-compile. This MUST track winit's
# objc2-app-kit major, never float ahead: a lone bump to 0.3.x drags in a whole
# SECOND objc2 stack beside winit's AND breaks the activate API — so dependabot is
# told to ignore it (.github/dependabot.yml) until winit itself moves.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSRunningApplication", "libc"] }

# Focus-jump on Linux (focus/linux.rs): the EWMH _NET_ACTIVE_WINDOW protocol needs
# an X11 client, and x11rb is already in-tree transitively via winit — so this MUST
# track the version winit AND softbuffer resolve to, exactly like the objc2-app-kit
# stanza above. A grouped dependabot bump to "0.14" silently built a SECOND x11rb +
# x11rb-protocol on every Linux build, and `cargo deny`'s [bans] is only "warn" so
# nothing caught it; dependabot holds this at 0.13.x until winit itself moves.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# GetShortPathNameW for the Codex/Reasonix Windows hook path: a
# space/metacharacter-bearing install path resolves to its DOS 8.3 short form so
# cmd.exe /C can invoke it. Same 0.61 major as pixtuoid-core — no second build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    # focus/windows.rs: Toolhelp32 ancestor walk + EnumWindows/SetForegroundWindow
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# `tests/wire_to_pixels.rs` drives real fixture bytes through the shared
# `pixtuoid_core::harness` pipeline, which is behind core's dev-only feature.
pixtuoid-core = { path = "../pixtuoid-core", version = "0.16.0", features = ["harness"] }
tempfile = "3"
# End-to-end CLI golden for `sources --json`, the Raycast contract (tests/cli_json.rs).
# Goldens update with SNAPSHOTS=overwrite.
snapbox  = { version = "1", features = ["json"] }
# Emits the SourceStatus JSON Schema — test/gen only, so the `JsonSchema` derive
# is `cfg_attr(test)` and this stays a dev-dep. See sources.rs + `just gen-contract`.
schemars = "1"
# test-util: paused-clock signal-arm tests in runtime/driver.rs (headless_loop).
tokio    = { workspace = true, features = ["test-util"] }
image    = { version = "0.25", default-features = false, features = ["png", "gif"] }
insta    = "1"
# Integration tests parse the `--json` CLI output back (cli_json.rs).
serde_json = { workspace = true }

[[example]]
name = "snapshot"
path = "examples/snapshot/main.rs"
test = true

[package.metadata.deb]
section = "utils"
assets = [
    ["target/release/pixtuoid", "usr/bin/", "755"],
]
extended-description = "Terminal-native, multi-agent pixel-art visualizer for AI coding agents. Each running Claude Code session appears as an animated sprite in a top-down ASCII office."
