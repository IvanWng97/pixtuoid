# Skeleton sprite pack — copy this directory and customize.
#
# Palette keys B/H/S are recolored per-agent; each MUST map to a unique RGB, since
# recolor substitutes by RGB equality. '.' is always transparent.

[pack]
name = "skeleton"
version = "0.1.0"

[palette]
"." = "transparent"
B = "#4488cc"       # Body / shirt — recolored per agent
H = "#443322"       # Hair — recolored per agent
S = "#e8c090"       # Skin — recolored per agent
P = "#334455"       # Pants
W = "#ffffff"       # White accent

# Every animation below is required, and each uses the same placeholder — replace them.

[animations.seated]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.typing]
frames = ["placeholder.sprite", "placeholder.sprite"]
frame_ms = 400

[animations.standing]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.walking]
frames = ["placeholder.sprite", "placeholder.sprite"]
frame_ms = 200

[animations.walking_back]
frames = ["placeholder.sprite", "placeholder.sprite"]
frame_ms = 200

[animations.seated_sleeping]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.seated_sleeping_alt]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.holding_coffee]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.back_couch]
frames = ["placeholder.sprite"]
frame_ms = 500
