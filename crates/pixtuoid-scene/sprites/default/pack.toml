[animations.door]
# The renderer picks the frame manually each tick from entry/exit progress, so
# `frame_ms` is irrelevant — 999999 only stops accidental cycling blinking the door.
frames   = ["door.sprite", "door_half.sprite", "door_open.sprite"]
frame_ms = 999999

