[hairstyles."side_part@4x"]
front = { behind = "hair_side_part_front_behind@4x.sprite", over = "hair_side_part_front_over@4x.sprite" }
back = { over = "hair_side_part_back_over@4x.sprite" }
side = { behind = "hair_side_part_side_behind@4x.sprite", over = "hair_side_part_side_over@4x.sprite" }
crown = { over = "hair_side_part_crown_over@4x.sprite" }

# The city behind the windows: scripts/gen-art.py's BUILDINGS, registered here
# by hand (`every_embedded_sprite_is_a_frame_the_pack_loads` fails on one left
# out), each with the planes it stands in. A tower stands near, where it rises
# tallest; a low block only in the middle distance, behind the towers.
[city]
facade = "+"
shade = "-"
roof = "~"
glass = "0"
mullion = "|"
detail = "*"
sign = "="

[buildings.curtain]
sprite = "building_curtain.sprite"
planes = ["mid", "near"]

[buildings."curtain@4x"]
sprite = "building_curtain@4x.sprite"

[buildings.dome]
sprite = "building_dome.sprite"
planes = ["mid"]

[buildings."dome@4x"]
sprite = "building_dome@4x.sprite"

[buildings.low]
sprite = "building_low.sprite"
planes = ["mid"]

[buildings."low@4x"]
sprite = "building_low@4x.sprite"

[buildings.setback]
sprite = "building_setback.sprite"
planes = ["mid", "near"]

[buildings."setback@4x"]
sprite = "building_setback@4x.sprite"

[buildings.sign]
sprite = "building_sign.sprite"
planes = ["mid"]

[buildings."sign@4x"]
sprite = "building_sign@4x.sprite"

[buildings.slab]
sprite = "building_slab.sprite"
