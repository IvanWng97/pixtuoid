[pack]
name = "skeleton"
version = "0.1.0"

[palette]
"." = "transparent"
B = "#4488cc"
H = "#443322"
S = "#e8c090"
P = "#334455"
W = "#ffffff"

[animations.seated]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.typing]
frames = ["placeholder.sprite", "placeholder.sprite"]
frame_ms = 400

[animations.standing]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.walking]
frames = ["placeholder.sprite", "placeholder.sprite"]
frame_ms = 200

[animations.walking_back]
frames = ["placeholder.sprite", "placeholder.sprite"]
frame_ms = 200

[animations.seated_sleeping]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.seated_sleeping_alt]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.holding_coffee]
frames = ["placeholder.sprite"]
frame_ms = 500

[animations.back_couch]
frames = ["placeholder.sprite"]
frame_ms = 500
