[package]
name                   = "pixtuoid-scene"
description            = "Backend-agnostic render + simulation engine for pixtuoid"
# Reads ../../site/src/sources.json at runtime, so `cargo test` on the
# extracted .crate would panic (no workspace tree).
exclude                = ["tests/site_badge_colors.rs"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

# `workspace = true` cannot be combined with per-crate lint tables (Cargo
# rejects the manifest), so this crate's `forbid(unsafe_code)` is a crate-root
# attribute in src/lib.rs instead.
[lints]
workspace = true

# `--no-default-features` drops `native`, giving a wasm32-buildable render
# engine (no tokio/notify) — the WebAssembly office hero.
[features]
default = ["native"]
native  = ["pixtuoid-core/native"]

[dependencies]
pixtuoid-core = { path = "../pixtuoid-core", version = "0.17.0", default-features = false }
anyhow        = { workspace = true }
tracing       = { workspace = true }
# `clock` gives Local::now() w/ system timezone for the wall clock.
chrono        = { version = "0.4", default-features = false, features = ["clock"] }
# Lab-space color blending — perceptually-correct twilight transitions and dim
# overlays vs naive sRGB linear blend.
palette       = { version = "0.7", default-features = false, features = ["std"] }

[dev-dependencies]
# `harness` is dev-only (see core's manifest), so `examples/corpus_check.rs`
# requests it here rather than in [dependencies].
pixtuoid-core = { path = "../pixtuoid-core", version = "0.17.0", default-features = false, features = ["harness"] }
serde_json = { workspace = true }
proptest   = "1"
tempfile   = "3"
# Statistical render-path benchmarks (`just bench`). Lean feature set: no
# plotters/rayon — numbers, not HTML reports.
criterion  = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render_frame"
harness = false
