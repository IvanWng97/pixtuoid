[package]
name                   = "pixtuoid-scene"
description            = "Backend-agnostic render + simulation engine for pixtuoid"
# Reads ../../site/src/sources.json at runtime, so `cargo test` on the
# extracted .crate would panic (no workspace tree).
exclude                = ["tests/site_badge_colors.rs", "tests/readme_chart_palette.rs"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
# The cutaway's fallback font, embedded: fonts/.
license                = "MIT AND OFL-1.1"
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

# `workspace = true` cannot be combined with per-crate lint tables (Cargo
# rejects the manifest), so this crate's `forbid(unsafe_code)` is a crate-root
# attribute in src/lib.rs instead.
[lints]
workspace = true

[features]
default     = ["native", "density-art"]
# Without it the render engine builds for wasm32 (no tokio/notify, no pack
# read from disk): the WebAssembly office hero.
native      = ["pixtuoid-core/native"]
# The bundled `@Nx` art and hair dressing, which only a render scale above
# `RenderScale::ONE` reaches (`densest_frame`, `dress_for`); the wasm hero
# renders at ONE, so building without this keeps those bytes out of the page.
density-art = []

[dependencies]
pixtuoid-core = { path = "../pixtuoid-core", version = "0.19.0", default-features = false }
anyhow        = { workspace = true }
tracing       = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
# `clock` gives Local::now() w/ system timezone for the wall clock.
chrono        = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
toml_edit = { workspace = true }

[dev-dependencies]
# `harness` is dev-only (see core's manifest), so `examples/corpus_check.rs`
# requests it here rather than in [dependencies].
pixtuoid-core = { path = "../pixtuoid-core", version = "0.19.0", default-features = false, features = ["harness"] }
serde_json = { workspace = true }
proptest   = "1"
tempfile   = "3"
# build_support/density_art.rs, which the tests compile too.
toml_edit  = { workspace = true }
# Statistical render-path benchmarks (`just bench`). The CodSpeed compat
# package is a documented passthrough to real criterion when CodSpeed is
# inactive, so local `cargo bench` behaves as plain criterion; codspeed.yml
# instruments the same benches in CI. Lean feature set: no plotters/rayon.
criterion  = { package = "codspeed-criterion-compat", version = "5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render_frame"
harness = false

# Without this an example is not a test target, so its `#[test]`s build and never
# run — the same wiring `pixtuoid-core`'s `capture_fixture` carries. This sibling
# produces the `--roster` contract three programs parse positionally.
[[example]]
name = "corpus_check"
test = true
required-features = ["native"]
