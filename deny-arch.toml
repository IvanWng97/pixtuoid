# Architecture invariant #1 (AGENTS.md): pixtuoid-core and pixtuoid-scene
# depend only on the crates below, so a terminal, window or audio-device
# crate fails until someone adds it here, with its reason in the PR. `just arch`
# runs this against those two crates alone: `exclude` drops the rest of the
# workspace, and `all-features` plus every target holds each dep any feature or
# platform can pull. An entry nothing uses is not reported, so the list can
# outgrow the set.

[graph]
all-features = true
exclude-dev = true
exclude = ["pixtuoid", "pixtuoid-hook", "pixtuoid-web"]

[bans]
multiple-versions = "allow"
allow-workspace = true
allow = [
    # Direct dependencies of the two crates.
    "anyhow",
    "chrono",
    "enum-map",
    "foldhash",
    "libc",
    "lru",
    "notify",
    "palette",
    "rustix",
    "serde",
    "serde_json",
    "strum",
    "thiserror",
    "tokio",
    "toml",
    "tracing",
    "unicode-segmentation",
    "unicode-width",
    "vec1",
    "windows-sys",
    # Transitive: pulled by the direct ones.
    "android_system_properties",
    "bitflags",
    "bumpalo",
    "by_address",
    "bytes",
    "cfg-if",
    "core-foundation-sys",
    "enum-map-derive",
    "equivalent",
    "errno",
    "fsevent-sys",
    "futures-core",
    "futures-task",
    "futures-util",
    "hashbrown",
    "heck",
