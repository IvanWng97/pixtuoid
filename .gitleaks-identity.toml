# The RECORDER's own machine identity in committed captures — a class no secret
# scanner detects, because none of it is a credential.
#
# Deliberately NOT `useDefault = true`, and that is the whole reason this is a
# second file rather than more rules in `.gitleaks.toml`. gitleaks' default
# GLOBAL allowlist waives anything shaped like a filesystem path, and a global
# allowlist outranks a rule-scoped one — verified by running these rules merged
# into the default corpus and again alone: `/home/alice` and `/home/alice/src/x.rs`
# are reported only when alone. So under the default corpus the home rule was HALF
# DEAD: every `/home/<person>`, bare or with a path, was waived.
#
# `/Users/<person>` fired in BOTH forms, with or without a trailing path — the
# rule's match stops at the username, so it never satisfies the default's
# two-segment `^/Users/…/…$` anchor. An earlier version of this note claimed
# otherwise; the measurement above is what reproduces.
#
# `.gitleaks.toml` keeps `useDefault` for the credential sweep, where waiving
# paths is correct. `just fixture-pii` runs both.

[[rules]]
id = "pixtuoid-recorder-identity"
description = "The recorder's own machine identity: a real MCP server/tool name"
regex = '''mcp__[A-Za-z0-9_-]+'''
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''mcp__example[A-Za-z0-9_-]*''']

[[rules]]
id = "pixtuoid-recorder-email"
description = "An email address that is not a bot or placeholder"
# Matches the VALUE, not the key. A `user_email`/`account_id` KEY rule fires on
# every one of this tree's legitimately-redacted `dev@example.com`, which is why
# the recorder's key markers do not survive as gitleaks rules — the refusal at
# capture time still uses them, this pass re-checks the class by its shape.
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = [
    '''@(?:users\.)?noreply\.github\.com$''',
    '''@example\.''',
    '''@localhost$''',
  ]

[[rules]]
id = "pixtuoid-recorder-bearer"
description = "A bearer credential in a captured header"
regex = '''Bearer\s+[A-Za-z0-9._~+/=-]{20,}'''

[[rules]]
id = "pixtuoid-foreign-home"
description = "A home path outside the /Users/dev redaction placeholder"
# Both separators: the one capture carrying a real Windows `cwd` cannot be
# re-recorded (the recorder is Unix-only), so a forward-slash-only rule is blind
# to exactly the tree that can never be regenerated.
regex = '''(?:/(?:Users|home)/|[A-Za-z]:\\+Users\\+)[A-Za-z0-9._-]+'''
  [[rules.allowlists]]
  regexTarget = "match"
  # TWO regexes, not one alternation, and the split is load-bearing beyond this
  # file: `captures.rs` reads the PLACEHOLDER line to build its redaction
  # sentinels. Merged, an unedited capture carrying `/home/vscode/proj` read as
  # EDITED and its honest note read as a silent one — the inversion this whole
  # mechanism exists to prevent.
  #
  # `you` and `test` were placeholders here and are gone: used nowhere, and the
  # likeliest of the set to BE somebody's account, which `(?i)` would then waive.
  #
  # ANCHORED, and the trailing `[._-]*` is not decoration: `.` and `-` are inside
  # the rule's own class, so a bare `\b` ends the match at the first one and
  # waives `/Users/dev-ops` and `/Users/first.last` — the ordinary shape on
  # directory-bound macOS. The run is what keeps the provenance notes that
  # end a sentence with "/Users/dev." passing.
  regexes = [
    # PLACEHOLDERS — a redaction wrote these, so they ARE evidence of an edit.
    '''^(?i)(?:/(?:Users|home)/|[A-Za-z]:\\+Users\\+)(?:dev|me|user)[._-]*$''',
    # LEGITIMATE HOSTS — infrastructure accounts naming no person, which a real
    # UNEDITED capture or a Linux-path assertion can carry: `runner` (GitHub
    # Actions), `ubuntu` (AWS, Codespaces), `vscode` (devcontainers), `linuxbrew`,
    # macOS's `Shared`.
    '''^(?i)(?:/(?:Users|home)/|[A-Za-z]:\\+Users\\+)(?:runner|ubuntu|vscode|linuxbrew|Shared)[._-]*$''',
  ]
