# The Python twin of no-comment-slop.yml — same convention, same advisory
# status. `scripts/comment-lint.py` diffed `*.rs` only, so every `.py` in the
# repo sat outside the fn-body comment convention enforced everywhere else.
# (The incident that surfaced the gap was a 9-line block on a one-line WORKFLOW
# step — YAML, which no ast-grep comment rule here covers; closing the Python
# hole is the adjacent, catchable half.)
#
# Simpler than the Rust rule: Python has no doc-comment syntax, so a docstring
# is a string EXPRESSION, not a comment, and is excluded without a regex. Only
# runs inside a `function_definition` count, so module-level and top-level-class
# `#` blocks are fine (a class nested INSIDE a fn is still inside it). ADVISORY
# only, diff-scoped; pre-existing runs are grandfathered.
id: no-comment-slop-py
language: Python
severity: warning
message: "3+ consecutive comment lines in a function body — trim to a WHY (≤2 lines), or move the rationale to the docstring / a CLAUDE.md sharp edge. A fact a test could pin belongs in the test."
rule:
  kind: comment
  inside:
    kind: function_definition
    stopBy: end
  follows:
    kind: comment
    stopBy: neighbor
    follows:
      kind: comment
      stopBy: neighbor
