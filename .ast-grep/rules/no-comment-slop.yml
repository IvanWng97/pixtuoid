# Flags a run of 3+ CONSECUTIVE plain `//` comments inside a function body — the
# repo's "fn-body comments <=2 lines" convention. A longer WHY belongs on the
# DECLARATION it explains or a CLAUDE.md sharp edge.
# Deliberately narrow: `///`/`//!` docs are excluded by the regex, only runs inside
# a `function_item` count, and the comments must be immediately consecutive.
# ADVISORY only — run diff-scoped (`just comment-lint`), never a merge gate; the
# pre-existing hits are grandfathered legitimate WHY.
# Twin: no-comment-slop-py.yml (same convention, `#` comments). ast-grep takes ONE
# language per rule, so threshold and message are duplicated — change both together.
id: no-comment-slop
language: Rust
severity: warning
message: "3+ consecutive line comments in a function body — trim to a WHY (≤2 lines), or move the rationale to the declaration doc / a CLAUDE.md sharp edge. A fact a test could pin belongs in the test."
rule:
  kind: line_comment
  regex: '^//($|[^/!])'
  inside:
    kind: function_item
    stopBy: end
  follows:
    kind: line_comment
    regex: '^//($|[^/!])'
    stopBy: neighbor
    follows:
      kind: line_comment
      regex: '^//($|[^/!])'
      stopBy: neighbor
