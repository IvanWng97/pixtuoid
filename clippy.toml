disallowed-methods = [
    { path = "std::env::var", reason = "it drops a non-UTF-8 value, a legal path, and the resolver silently falls back elsewhere; read a location with `platform::path_env`, text with `platform::text_env` (the hook, which cannot depend on core: its `paths::path_env` twin, or `std::env::var_os`)" },
    { path = "std::env::vars", reason = "it panics on a non-UTF-8 entry; use `std::env::vars_os`" },
    { path = "open::that", reason = "it blocks the event loop until the launcher exits (`xdg-open` on Linux waits for the browser); call `panels::open_url`, which detaches" },
]
disallowed-macros = [
    { path = "snapbox::file", reason = "it resolves against the outermost Cargo.toml, so in a nested worktree it reads and overwrites the main checkout's golden; use `snapbox::Data::read_from` on a `CARGO_MANIFEST_DIR` path" },
]
