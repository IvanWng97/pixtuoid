# DO NOT delete or rename this file without a coordinated homebrew-core PR:
# their formula's `install` opens with `rm ".cargo/config.toml"` (to drop the
# lld pin below). Ruby's `rm` raises Errno::ENOENT on a missing path, so
# removing this file fails their build on its FIRST line.
#
# Link with lld on x86_64 Linux — every ubuntu-latest CI job links natively for
# this target and the runner image ships lld. Linux contributors need it too
# (`apt install lld`).
#
# Deliberately NOT set for aarch64-unknown-linux-gnu: that target is only ever
# built through `cross` Docker containers, whose images carry a gcc cross
# toolchain without lld, so the flag would break the release at tag time.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
