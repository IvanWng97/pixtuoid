# cargo-mutants config (see `just mutants`). Mutation testing injects bugs and
# checks the tests catch them — the "do your assertions have teeth?" dimension
# that line/region coverage can't see. Use the project's runner (nextest) and
# exclude the paths (`exclude_globs`) and FUNCTIONS (`exclude_re`) where a
# surviving mutant is NOISE, not a real gap, so the advisory signal stays high.
#
# READ THIS BEFORE ACTING ON A `pixtuoid-core` / `pixtuoid-scene` SURVIVOR.
# `test_workspace` is deliberately left at its default, which means "only the
# tests in the mutated package are run" (`cargo mutants --help`). That is a
# systematic BLIND SPOT for this repo specifically, because core/scene behaviour
# is covered on purpose by the BINARY's headless harness (~100 integration tests
# driving the real TuiRenderer), not by core's own unit tests. So a core/scene
# mutant can be reported MISSED while `-p pixtuoid` catches it outright —
# measured, not theorised: making `SceneState::insert_daemon` a no-op reds 8 of 9
# `harness::mascot` tests while all 53 of core's own daemon tests stay green, and
# it still reported as a survivor.
#
# So: for a survivor in core/scene, REPRODUCE IT FIRST — apply the mutation and
# run `-p pixtuoid` too. Only write a new test if the mutation genuinely survives
# the whole workspace. Otherwise you are padding the suite, or "fixing" code that
# already works.
#
# Turning it on is the accurate-but-unusable option: the 2026-07 run of this diff
# took 2h for 221 mutants package-scoped (~33s each), while the full workspace
# suite is ~135s per mutant — so the same run would be ~8h. For an ADVISORY check
# that trade is not worth it. Pass `--test-workspace true` by hand
# (`just mutants --test-workspace true`) when auditing core/scene specifically and
# you can afford the wall-clock.
test_tool = "nextest"

exclude_globs = [
    # Untestable painter / async + winit glue — no headless test can kill their
    # mutants, so every one "survives" = noise. These four are a SUBSET of the
    # painter files codecov.yml ignores; the lists overlap without either being
    # a subset of the other, since codecov also ignores crash/logging/sources_cli
    # (pure helpers stay unit-tested — sources_cli via the cli_json e2e — so
    # their mutants stay IN), this file also excludes the pixtuoid-core probe
    # files below, and tui/mod.rs + driver.rs are ignored THERE but mutated HERE
    # (see the note under this list). Edit shared entries together.
    "crates/pixtuoid/src/main.rs",
    "crates/pixtuoid/src/runtime/pipeline.rs",
    "crates/pixtuoid/src/floating/mod.rs",
    "crates/pixtuoid/src/floating/window.rs",
    # NOT excluded, though codecov.yml ignores both: `tui/mod.rs` and
    # `runtime/driver.rs` are line-uncoverable in BULK while still carrying a
    # unit-tested pure decision layer, and per-FUNCTION mutants see that split
    # where per-LINE coverage cannot. Their untestable glue is pinned by
    # FUNCTION in `exclude_re` below rather than hidden by file, so the decision
    # layers stay in scope. The evidence behind that, and its exact limits:
    # - tui/mod.rs carries 135 mutants (`cargo mutants --list --no-config
    #   --package pixtuoid --file crates/pixtuoid/src/tui/mod.rs`), 72 of them in
    #   `dispatch_key` alone. Exactly 22 have ever been RUN — those matching
    #   `-F 'toggle_intent|is_quit_chord|should_dispatch_key'` — scoring 19
    #   caught, 1 unviable, 2 missed (the `should_dispatch_key` match guards at
    #   700:38, inside `run_tui`, now excluded by function). 14 of those 22 are
    #   `is_quit_chord` guards INSIDE `dispatch_key`, so the run covered 22 of
    #   the 78 mutants those four fns carry — NOT all of them. The other 113 are
    #   UNMEASURED: a survivor there is unknown, not known noise, so measure it
    #   before dismissing it.
    # - driver.rs carries 9 mutants and none has been run under mutation. The 6
    #   naming fns with zero test call sites are excluded below; the 3 left in
    #   are the ones a test can reach (`build_source_set` x2 via the
    #   registry-drift test, `headless_loop_with_signal` via the two signal-arm
    #   tests).
    # File-level exclusion was still the wrong tool: it hid all 135 and all 9,
    # killable ones included, and an exclusion that hides a killable mutant is
    # worse than a noisy row (the same call as the `mascot_position` pair below).
    # Timing / FFI liveness probes: their tests assert wall-clock + OS behavior and
    # flake under mutation load — a "survivor" here is a flaked test, not a missing
    # assertion (this repo is flake-averse; #352-#354).
    "crates/pixtuoid-core/src/source/exit_watch.rs",
    "crates/pixtuoid-core/src/source/fd_probe.rs",
    # cfg(windows)-gated: never COMPILED on the unix hosts that run mutants, so
    # the mutated code can't reach any test binary and every mutant "survives"
    # as pure cross-compile noise (10/10 in the 2026-07 full run). Real Windows
    # coverage lives in the windows-test CI job's actual test run.
    "crates/pixtuoid-core/src/source/hook/windows.rs",
]

exclude_re = [
    # Equivalent-mutant classes verified by hand in the 2026-07 survivor triage
    # (each re-confirmed surviving on current main, then proven UNOBSERVABLE —
    # not merely untested):
    #
    # ChildEndUnclaims prunes on `Instant::now()` deltas — `<` vs `<=` differs
    # only when two monotonic reads land on the same instant, which no
    # deterministic test can arrange (the non-boundary prune/dedupe behavior
    # IS pinned by unclaim.rs's unit tests).
    'unclaim\.rs.*replace < with <= in ChildEndUnclaims',
    # `mascot_position`'s walk-in boundary, `if entered < MASCOT_ENTER_MS`. `<=`
    # extends the leg by one millisecond, and at that instant the walk-in's own t=1
    # endpoint IS `home`, which is also the wander's forced cycle-0 origin ("Cycle 0's
    # origin is forced to `home` so it joins the enter walk pop-free" — mascot_wander),
    # so both branches render the identical Point. Measured per consecutive-port seed,
    # including the frames either side.
    #
    # Its SIBLING boundary is deliberately NOT excluded any more: `if age < enter_delay`
    # used to HOLD the mascot at the elevator, making `<=` a one-millisecond no-op, but
    # the stagger now returns `None` instead — so `<=` changes drawn to not-drawn at
    # exactly `age == enter_delay`, which is observable and IS killed (verified) by
    # `the_walk_out_starts_from_where_the_mascot_was_when_it_died`'s arrival assertion.
    # An exclusion that hides a killable mutant is worse than a noisy row — and
    # cargo-mutants describes the two boundaries IDENTICALLY ("replace < with <= in
    # mascot_position"), so no regex can exclude one without the other. Hence NEITHER
    # is excluded: the walk-in one will show up as a known-noise row, documented here,
    # and the stagger one is genuinely caught. (Same call as the `% with /` pair in
    # `mascot_spot_for` before that fn was deleted.)
    # The unix hook-socket bind's `tmp.len() > 100` picks between two bind
    # strategies (temp-rename vs direct+chmod) whose end states are
    # byte-identical — the boundary is sun_path headroom, distinguishable only
    # by which syscall sequence ran, invisible to any external observation.
    'hook/unix\.rs.*replace > with >= in Listener::bind',
    # `pid_start_time_secs` is a cfg-twin pair (macOS proc_pidinfo / non-macOS
    # `None` fallback): on ANY host the OTHER platform's variant is compiled
    # out, so its mutants always "survive" — fn-level cross-compile noise
    # (the windows.rs class). BOTH variants are pinned by cfg-twin tests in
    # cc_probe.rs (`pid_start_time_is_plausible_epoch_seconds_for_own_process`
    # / `pid_start_time_is_deliberately_unavailable_off_macos`), which run on
    # their own platforms.
    'cc_probe\.rs.*replace pid_start_time_secs',
    # `plant_ground_in_bounds` selects which scatter plants the #566 connectivity
    # guard drops (aisle-resident sealers) vs the `plants.clear()` last resort.
    # Within the SWEPT space (narrow-band 32..=76 × {80,100,120,160} × seeds 0..11)
    # the mutant is UNOBSERVABLE: at every config where the guard fires (the
    # 59-60×160 single-pod-column seals) BOTH corridor plants are already aisle-
    # resident, so the targeted retain empties the list identically to clear-all,
    # and the configs that keep a plant (38-42×160) never seal. The targeted path
    # is NOT dead, though — `plants` can also carry meeting-room + Ficus plants
    # (compute.rs) that sit far from `cubicle_aisle`, so a seal involving one
    # (outside the swept space) is exactly where `plant_ground_in_bounds` protects
    # it from the clear-all sledgehammer: genuine future-proofing. The
    # never-ship-a-pocket invariant IS pinned (appliance_strip_not_sealed_at_a_
    # single_pod_band + the boundary scan), so only the unobservable culprit-vs-
    # blanket distinction survives — an equivalent mutant within reach today.
    'compute\.rs.*plant_ground_in_bounds',
    #
    # A SECOND class, deliberately kept apart from the equivalent mutants above:
    # untestable GLUE inside two files that are otherwise mutated. These are the
    # function-granular replacement for the `tui/mod.rs` + `runtime/driver.rs`
    # file exclusions dropped from `exclude_globs`, which is what lets the pure
    # decision layers in the same files stay in scope. Every fn named here has
    # ZERO test call sites — production callers only — so nothing exists that
    # could kill a mutant in it. That is a call-graph fact (`--list` plus a grep
    # for each name), NOT a claim that a mutation run scored them; re-derive both
    # before adding a name, and delete a name the moment a test reaches it.
    'tui/mod\.rs.*(run_tui|focus_clicked_agent|setup_terminal|teardown_terminal|resolve_version_popup)',
    'runtime/driver\.rs.*replace (run|run_async|headless_loop|compute_boot_capacities) ->',
    'runtime/driver\.rs.*replace reducer_task with',
]
