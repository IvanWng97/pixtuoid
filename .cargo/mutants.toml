# cargo-mutants config (`just mutants`). Advisory: exclude only where a surviving
# mutant is NOISE, never where it is killable. Rationale for each entry lives in
# the commit that added it; `docs/mutants-exclusions.md` holds the measured
# derivations and the core/scene `test_workspace` blind spot.
test_tool = "nextest"

exclude_globs = [
    # winit / async glue: no headless test can kill these. Shared with codecov.yml's
    # ignore list — edit together. These four are that list's intersection, so a
    # decision here is measured by NOTHING: move it out instead of widening (#827).
    "crates/pixtuoid/src/main.rs",
    "crates/pixtuoid/src/runtime/pipeline.rs",
    "crates/pixtuoid/src/floating/mod.rs",
    "crates/pixtuoid/src/floating/window.rs",
    # tui/mod.rs + runtime/driver.rs are ignored by codecov but MUTATED here: they
    # carry unit-tested decision layers, so their glue is excluded by fn below.
    # Timing/FFI probes: a survivor here is a flaked test, not a missing assertion.
    "crates/pixtuoid-core/src/source/exit_watch.rs",
    "crates/pixtuoid-core/src/source/fd_probe.rs",
    # cfg(windows): never compiled on the unix hosts that run mutants.
    "crates/pixtuoid-core/src/source/hook/windows.rs",
]

exclude_re = [
    # Equivalent mutants — each verified UNOBSERVABLE by hand, not merely untested.
    'unclaim\.rs.*replace < with <= in ChildEndUnclaims',       # same-instant monotonic reads
    'hook/unix\.rs.*replace > with >= in Listener::bind',       # byte-identical end states
    'cc_probe\.rs.*replace pid_start_time_secs',                # cfg-twin; both pinned per-platform
    'compute\.rs.*plant_ground_in_bounds',                      # targeted retain == clear-all in range
    'liveness\.rs.*replace > with >= in ProbeSnapshot::bind_pid',  # writes the value already there
    'jsonl/mod\.rs.*replace no_cwd_from_path ->',               # sole caller collapses both spellings
    # Untestable glue inside otherwise-mutated files: ZERO test call sites, so
    # nothing exists that could kill them. Delete a name the moment a test reaches it.
    'tui/mod\.rs.*(run_tui|focus_clicked_agent|setup_terminal|teardown_terminal|resolve_version_popup)',
    'runtime/driver\.rs.*replace (run|run_async|headless_loop|compute_boot_capacities) ->',
    'runtime/driver\.rs.*replace reducer_task with',
    # Reached under test, but only on a branch where the mutation is unobservable.
    'unix\.rs.*replace ensure_owned_socket_dir ->',   # tests hit only the no-op branch
    'liveness\.rs.*replace ProbeSnapshot::from_open_fds ->',  # proc walk finds nothing under test
]
