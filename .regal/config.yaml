# Regal (the OPA project's Rego linter) over policy/ci-observability. Anything not
# disabled below is ON and gated by `just regal`.
rules:
  idiomatic:
    # Rewriting `object.get(o, "k", default)` to a bare `o.k` is NOT equivalent:
    # on a MISSING key the bare ref is undefined, so the rule body never fires and
    # the check silently passes fail-open.
    superfluous-object-get:
      level: ignore
    # Conftest evaluates the `deny` set directly and has no entrypoint concept.
    no-defined-entrypoint:
      level: ignore
    # Conftest requires the policy in the `main` namespace regardless of directory.
    directory-package-mismatch:
      level: ignore
  testing:
    # `conftest verify` discovers `x_test.rego` in the SAME package as `x.rego`; a
    # separate _test package would break the tool that runs them.
    test-outside-test-package:
      level: ignore
  style:
    # Exactly one helper needs three: `pinned_npm_setup_steps` reads `documents`
    # plus two package constants. Raised by one rather than disabled, so a fourth
    # reference still trips it.
    external-reference:
      max-allowed: 3
    # The policy's WHY comments and sprintf messages are deliberately long-form.
    line-length:
      level: ignore
    # main.rego is one cross-file CI contract by design.
    file-length:
      level: ignore
    rule-length:
      level: ignore
